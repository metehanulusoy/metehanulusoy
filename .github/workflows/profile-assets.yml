name: Refresh live panels

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "assets/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: live-panels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify hand-written assets
        run: |
          python -m compileall -q scripts
          python scripts/validate_assets.py

      # --- live panels -------------------------------------------------------
      # Each generator writes its SVG into the workspace; everything is gathered
      # into a single publish/ directory below. There is exactly ONE publish step
      # on purpose: the deploy runs with keep_history:false, so a second deploy
      # would wipe the first one's files off the output branch.

      # github-stats-terminal-style cannot be used with `uses:` — the project never
      # commits its compiled dist/, on any branch or tag, so the action entrypoint
      # is missing everywhere. Build it from a pinned commit and run it directly;
      # the action reads its inputs from INPUT_* environment variables.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build terminal stats card
        env:
          INPUT_USERNAME: metehanulusoy
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_THEME: hacker
          INPUT_HEADERSTYLE: retro
          INPUT_TYPINGSPEED: "60"
          INPUT_COMMANDS: whoami,neofetch,exit
          INPUT_OUTPUTPATH: ${{ github.workspace }}/terminal-hacker.svg
        run: |
          git clone --quiet https://github.com/yogeshwaran01/github-stats-terminal-style.git "$RUNNER_TEMP/tsg"
          cd "$RUNNER_TEMP/tsg"
          git checkout --quiet 9822eb42e2f3fe71e03676f85668217b91938142
          npm ci --silent
          npm run build
          node dist/src/action/index.js
          test -s "$GITHUB_WORKSPACE/terminal-hacker.svg"

      - name: Build 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: metehanulusoy

      - name: Build contribution-grid game
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: metehanulusoy
          games: bomberman

      - name: Collect publishable assets
        run: |
          mkdir -p publish
          cp terminal-hacker.svg publish/
          cp profile-3d-contrib/profile-night-rainbow.svg publish/
          cp dist/bomberman-contribution-graph.svg publish/
          cp dist/bomberman-contribution-graph-dark.svg publish/
          ls -la publish/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: publish
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
