name: Refresh profile signal

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "assets/**"
      - "scripts/**"
      - "conf/**"
      - "README.md"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify source and static project cards
        run: |
          python -m compileall -q scripts
          python scripts/build_project_cards.py --check
          python scripts/validate_assets.py

      - name: Build live release ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: metehanulusoy
        run: python scripts/build_terminal_card.py --require-live

      - name: Validate generated assets
        run: python scripts/validate_assets.py

      - name: Collect publishable assets
        run: |
          mkdir -p publish
          cp assets/generated/terminal-card.svg publish/
          cp assets/generated/terminal-card-mobile.svg publish/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: publish
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
