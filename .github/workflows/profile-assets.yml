name: Validate profile assets

# The Synthwave design draws everything from hand-written SVGs in assets/ and from
# live third-party URLs, so nothing needs generating any more. The nightly job that
# built a terminal card, a 3D calendar and a contribution game and published them to
# the `output` branch was removed with the panels that referenced them — it was
# spending a run every night on files no page loaded.
#
# To bring a generated panel back, restore the build and publish steps from the
# history of this file (they were pinned and working) and reference the file from
# the output branch in README.md.

on:
  workflow_dispatch:
  schedule:
    # the AniList panel is generated, so it needs a nightly refresh
    - cron: "17 5 * * *"
  push:
    branches: [master]
    paths:
      - "assets/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify hand-written assets
        run: |
          python -m compileall -q scripts
          python scripts/validate_assets.py

  anilist:
    # Skipped on push so committing the regenerated card cannot chase its own tail.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Redraw the AniList panel
        run: |
          python -m pip install --quiet --disable-pip-version-check "pillow==12.1.1"
          python scripts/build_anilist_card.py
          python scripts/validate_assets.py

      - name: Commit it if the numbers moved
        run: |
          if git diff --quiet -- assets/anilist.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anilist.svg
          git commit -m "chore(profile): refresh the AniList panel"
          git push
