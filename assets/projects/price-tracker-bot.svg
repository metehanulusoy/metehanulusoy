<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-label="PRICE TRACKER BOT: Monitors Trendyol and Amazon prices with Telegram alerts and history charts">
  <title>PRICE TRACKER BOT</title>
  <desc>Monitors Trendyol and Amazon prices with Telegram alerts and history charts</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720"/><stop offset="1" stop-color="#080D14"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#F59E0B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FF7167" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F59E0B" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .panel{fill:url(#panel)} .edge{fill:none;stroke:url(#edge);stroke-width:1.25}
    .grid{fill:url(#grid)} .title{font:700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Roboto, sans-serif;letter-spacing:.4px;fill:#E6EDF3}
    .eye{font:600 9.5px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;letter-spacing:1.7px;fill:#F59E0B}
    .body{font:400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Roboto, sans-serif;fill:#9DA7B3}
    .num{font:600 10px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;fill:#F59E0B} .signal{font:600 9px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;letter-spacing:1px;fill:#9DA7B3}
    .pill{fill:#F59E0B;fill-opacity:.075;stroke:#F59E0B;stroke-opacity:.24}
    .pill-text{font:600 9.5px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;fill:#B9C3CE}
    .orb{animation:pulse 2.8s ease-in-out infinite} .scan{animation:scan 5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes scan{0%,12%{transform:translateX(-520px);opacity:0}35%,65%{opacity:.55}88%,100%{transform:translateX(520px);opacity:0}}
    @media (prefers-color-scheme:light){
      .panel{fill:#F6F8FA} .title{fill:#1F2328} .body,.signal{fill:#57606A}
      .pill-text{fill:#3F4852} .grid{opacity:.45}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect class="panel" x="1" y="1" width="518" height="178" rx="14"/>
  <rect class="grid" x="1" y="1" width="518" height="178" rx="14"/>
  <rect class="edge" x="1" y="1" width="518" height="178" rx="14"/>
  <rect class="scan" x="-120" y="1" width="120" height="178" fill="#F59E0B" opacity="0"/>
  <text class="num" x="26" y="28">// 04</text>
  <circle cx="394" cy="24" r="3" fill="#F59E0B"/><circle cx="394" cy="24" r="8" fill="#F59E0B" opacity=".14" filter="url(#glow)"/>
  <text class="signal" x="404" y="28">WATCH / ACTIVE</text>
  <text class="eye" x="26" y="51">AUTOMATION · ALERTING</text>
  <text class="title" x="26" y="80">PRICE TRACKER BOT</text>
  <text class="body" x="26" y="105">Monitors Trendyol and Amazon prices</text>
  <text class="body" x="26" y="123">with Telegram alerts and history charts</text>
  <g transform="translate(26 142)"><rect class="pill" width="60" height="24" rx="12"/><text class="pill-text" x="30.0" y="16" text-anchor="middle">Python</text></g><g transform="translate(94 142)"><rect class="pill" width="74" height="24" rx="12"/><text class="pill-text" x="37.0" y="16" text-anchor="middle">Telegram</text></g><g transform="translate(176 142)"><rect class="pill" width="60" height="24" rx="12"/><text class="pill-text" x="30.0" y="16" text-anchor="middle">Charts</text></g>
  <g transform="translate(438 100)" stroke="#F59E0B" stroke-width="1.7" fill="none">
          <path d="M0-43v12M-11-43h22M-35-27h70a8 8 0 018 8v48a8 8 0 01-8 8h-70a8 8 0 01-8-8v-48a8 8 0 018-8z"/>
          <circle cx="-18" cy="1" r="5"/><circle cx="18" cy="1" r="5"/><path d="M-18 21h36M-51-9v28M51-9v28" opacity=".65"/>
          <circle class="orb" cx="0" cy="-43" r="4" fill="#FF7167" stroke="none"/>
        </g>
</svg>
