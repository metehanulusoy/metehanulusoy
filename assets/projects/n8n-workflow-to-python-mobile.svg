<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 218" role="img" aria-label="WORKFLOW TO PYTHON: Turns n8n workflow JSON into readable Python scripts in the browser">
  <title>WORKFLOW TO PYTHON</title>
  <desc>Turns n8n workflow JSON into readable Python scripts in the browser</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101720"/><stop offset="1" stop-color="#080D14"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#F472B6" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .panel{fill:url(#panel)}.edge{fill:none;stroke:url(#edge)}.grid{fill:url(#grid)}
    .title{font:700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Roboto, sans-serif;letter-spacing:.2px;fill:#E6EDF3}.eye{font:650 8px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;letter-spacing:1.25px;fill:#F472B6}
    .body{font:400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Roboto, sans-serif;fill:#9DA7B3}.num{font:650 8px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;fill:#F472B6}.signal{font:650 7.5px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;letter-spacing:.8px;fill:#9DA7B3}
    .pill{fill:#F472B6;fill-opacity:.075;stroke:#F472B6;stroke-opacity:.26}.pill-text{font:650 8.5px "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;fill:#B9C3CE}
    .orb{animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.title{fill:#1F2328}.body,.signal{fill:#57606A}.pill-text{fill:#3F4852}.grid{opacity:.45}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect class="panel" x="1" y="1" width="358" height="216" rx="14"/><rect class="grid" x="1" y="1" width="358" height="216" rx="14"/><rect class="edge" x="1" y="1" width="358" height="216" rx="14"/>
  <text class="num" x="20" y="24">// 06</text><circle cx="246" cy="21" r="2.5" fill="#F472B6"/><circle cx="246" cy="21" r="7" fill="#F472B6" opacity=".14" filter="url(#glow)"/><text class="signal" x="254" y="24">CONVERT / READY</text>
  <text class="eye" x="20" y="52">DEVELOPER TOOLING</text><text class="title" x="20" y="81">WORKFLOW TO PYTHON</text>
  <text class="body" x="20" y="112">Turns n8n workflow JSON into</text><text class="body" x="20" y="130">readable Python scripts in the browser</text>
  <path d="M20 151H340" stroke="#F472B6" stroke-opacity=".15"/><g transform="translate(20 171)"><rect class="pill" width="76" height="27" rx="13.5"/><text class="pill-text" x="38.0" y="18" text-anchor="middle">Automation</text></g><g transform="translate(103 171)"><rect class="pill" width="52" height="27" rx="13.5"/><text class="pill-text" x="26.0" y="18" text-anchor="middle">n8n</text></g><g transform="translate(162 171)"><rect class="pill" width="58" height="27" rx="13.5"/><text class="pill-text" x="29.0" y="18" text-anchor="middle">Codegen</text></g>
  <g transform="translate(296 103)" stroke="#F472B6" stroke-width="1.7" fill="none">
          <path d="M-43-34h-12v68h12M43-34h12v68H43M-29 18l18-36M2-18l18 18-18 18"/>
          <circle class="orb" cx="20" cy="0" r="4.5" fill="#60A5FA" stroke="none"/>
        </g>
</svg>
