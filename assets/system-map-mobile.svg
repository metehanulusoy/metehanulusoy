<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" role="img" aria-label="Vertical build, break, learn, and ship loop">
  <title>Build, break, learn, ship</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E151E"/><stop offset="1" stop-color="#080D13"/></linearGradient><linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#36F1CD"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64E8C1" stroke-opacity=".04"/></pattern></defs>
  <style>.panel{fill:url(#bg);stroke:#33404C}.grid{fill:url(#grid)}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}.mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.micro{font-size:12px;font-weight:650;letter-spacing:1.4px;fill:#82909C}.head{font-size:26px;font-weight:720;fill:#EAF2F8}.sub{font-size:15px;fill:#9EABB6}.path{stroke:url(#flow);stroke-width:2;stroke-dasharray:4 10;animation:f 4s linear infinite}.node{fill:#0D151E;stroke:#64E8C1;stroke-opacity:.42}.node2{fill:#101322;stroke:#8B5CF6;stroke-opacity:.42}.label{font-size:14px;font-weight:720;letter-spacing:1px;fill:#C4CED7}.cap{font-size:11px;fill:#82909C}.fail{fill:#1B1114;stroke:#FF7167;stroke-opacity:.52}.risk{stroke:#FF7167;stroke-dasharray:5 8;fill:none}.dot{fill:#64E8C1}@keyframes f{to{stroke-dashoffset:-56}}@media(prefers-color-scheme:light){.panel{fill:#F6F8FA;stroke:#D0D7DE}.grid{opacity:.5}.head{fill:#1F2328}.sub,.micro,.cap{fill:#57606A}.node{fill:#FFF}.node2{fill:#F8F5FF}.fail{fill:#FFF5F5}.label{fill:#323A43}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
  <rect class="panel" x="1" y="1" width="598" height="858" rx="18"/><rect class="grid" x="1" y="1" width="598" height="858" rx="18"/>
  <text class="micro mono" x="30" y="39">BUILD LOOP / ITERATION</text><text class="head sans" x="30" y="78">Build → break → learn → ship.</text><text class="sub sans" x="30" y="108">The project changes. The loop stays.</text>
  <path class="path" d="M300 156V696"/>
  <g class="mono">
    <g transform="translate(300 166)"><rect class="node" x="-160" y="-29" width="320" height="58" rx="15"/><text class="label" x="-130" y="-2">IDEA</text><text class="cap" x="-130" y="15">start with a question</text></g>
    <g transform="translate(300 254)"><rect class="node2" x="-160" y="-29" width="320" height="58" rx="15"/><text class="label" x="-130" y="-2">EXPLORE</text><text class="cap" x="-130" y="15">research and play</text></g>
    <g transform="translate(300 342)"><rect class="node" x="-160" y="-29" width="320" height="58" rx="15"/><text class="label" x="-130" y="-2">DESIGN</text><text class="cap" x="-130" y="15">shape the interface</text></g>
    <g transform="translate(300 430)"><rect class="node2" x="-160" y="-29" width="320" height="58" rx="15"/><text class="label" x="-130" y="-2">BUILD</text><text class="cap" x="-130" y="15">make it real</text></g>
    <g transform="translate(300 518)"><rect class="node" x="-160" y="-29" width="320" height="58" rx="15"/><text class="label" x="-130" y="-2">TEST</text><text class="cap" x="-130" y="15">check the behavior</text></g>
    <g transform="translate(300 606)"><rect class="node2" x="-160" y="-29" width="320" height="58" rx="15"/><text class="label" x="-130" y="-2">BREAK IT</text><text class="cap" x="-130" y="15">find the edge cases</text></g>
    <g transform="translate(300 694)"><rect class="node" x="-160" y="-29" width="320" height="58" rx="15"/><circle class="dot" cx="-131" cy="-6" r="4"/><text class="label" x="-116" y="-2">SHIP</text><text class="cap" x="-116" y="15">share and learn</text></g>
    <path class="risk" d="M461 606C545 606 548 774 430 774H180"/>
    <g transform="translate(300 788)"><rect class="fail" x="-175" y="-31" width="350" height="62" rx="15"/><circle cx="-145" cy="-7" r="4" fill="#FF7167"/><text class="label" x="-130" y="-2">BUG → LESSON</text><text class="cap" x="-130" y="16">feed the next iteration</text></g>
  </g>
  <g class="motion"><circle r="4" fill="#64E8C1"><animateMotion dur="8s" repeatCount="indefinite" path="M300 137V723"/></circle><circle r="3" fill="#FF7167"><animateMotion dur="10s" repeatCount="indefinite" path="M461 606C545 606 548 774 430 774H180"/></circle></g>
  <text class="micro mono" x="30" y="842">CURIOUS / INTENTIONAL / TESTED / ITERATIVE</text>
</svg>
