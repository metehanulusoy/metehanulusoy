<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Creative engineering loop: idea, explore, design, build, test, break, ship, and learn">
  <title>Build, break, learn, ship</title>
  <desc>Ideas move through exploration, design, code, testing and deliberate breakage. Bugs become lessons for the next iteration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E151E"/><stop offset="1" stop-color="#080D13"/></linearGradient>
    <linearGradient id="pathGrad" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="910" y2="0"><stop stop-color="#36F1CD"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64E8C1" stroke-opacity=".038"/></pattern>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <style>
    .panel{fill:url(#bg);stroke:#33404C}.grid{fill:url(#grid)}.mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}.micro{font-size:9px;font-weight:650;letter-spacing:1.35px;fill:#82909C}
    .headline{font-size:22px;font-weight:720;fill:#EAF2F8}.sub{font-size:12px;fill:#9EABB6}.mainpath{fill:none;stroke:url(#pathGrad);stroke-width:1.6;stroke-opacity:.55}
    .feedback{fill:none;stroke:#FF7167;stroke-width:1.3;stroke-opacity:.55;stroke-dasharray:5 7}.node{fill:#0D151E;stroke:#64E8C1;stroke-opacity:.42}.node2{fill:#101322;stroke:#8B5CF6;stroke-opacity:.4}
    .fail{fill:#1B1114;stroke:#FF7167;stroke-opacity:.5}.label{font-size:9px;font-weight:700;letter-spacing:.85px;fill:#C4CED7}.caption{font-size:8.2px;fill:#82909C}
    .gate{fill:#64E8C1}.risk{fill:#FF7167}.packet{fill:#64E8C1}.packet2{fill:#A78BFA}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:3 9;animation:flow 4s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-48}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA;stroke:#D0D7DE}.grid{opacity:.5}.headline{fill:#1F2328}.sub{fill:#57606A}.micro,.caption{fill:#57606A}.node{fill:#FFF}.node2{fill:#F8F5FF}.fail{fill:#FFF5F5}.label{fill:#323A43}.mainpath{stroke-opacity:.7}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
  </style>
  <rect class="panel" x="1" y="1" width="998" height="358" rx="16"/>
  <rect class="grid" x="1" y="1" width="998" height="358" rx="16"/>
  <text class="micro mono" x="34" y="36">BUILD LOOP / ITERATION</text>
  <text class="headline sans" x="34" y="70">Build → break → learn → ship.</text>
  <text class="sub sans" x="34" y="94">The project changes. The loop stays.</text>

  <path class="mainpath flow" d="M96 194H200H330H460H590H720H850"/>
  <path class="feedback flow" d="M720 194C720 290 590 301 460 301S260 290 260 238"/>

  <g class="mono">
    <g transform="translate(96 194)"><circle class="node" r="34"/><text class="label" y="-2" text-anchor="middle">IDEA</text><text class="caption" y="13" text-anchor="middle">question</text></g>
    <g transform="translate(220 194)"><circle class="node2" r="40"/><text class="label" y="-2" text-anchor="middle">EXPLORE</text><text class="caption" y="13" text-anchor="middle">research</text></g>
    <g transform="translate(350 194)"><circle class="node" r="40"/><text class="label" y="-2" text-anchor="middle">DESIGN</text><text class="caption" y="13" text-anchor="middle">interface</text></g>
    <g transform="translate(480 194)"><circle class="node2" r="40"/><text class="label" y="-2" text-anchor="middle">BUILD</text><text class="caption" y="13" text-anchor="middle">code</text></g>
    <g transform="translate(610 194)"><circle class="node" r="40"/><text class="label" y="-2" text-anchor="middle">TEST</text><text class="caption" y="13" text-anchor="middle">behavior</text></g>
    <g transform="translate(740 194)"><path class="node2" d="M0-45L43 0 0 45-43 0Z"/><text class="label" y="-2" text-anchor="middle">BREAK IT</text><text class="caption" y="13" text-anchor="middle">edge cases</text></g>
    <g transform="translate(880 194)"><circle class="node" r="36"/><circle class="gate pulse" cy="-14" r="4"/><text class="label" y="5" text-anchor="middle">SHIP</text><text class="caption" y="20" text-anchor="middle">then learn</text></g>

    <g transform="translate(480 301)"><rect class="fail" x="-73" y="-22" width="146" height="44" rx="11"/><circle class="risk pulse" cx="-52" r="4"/><text class="label" x="-39" y="-2">BUG → LESSON</text><text class="caption" x="-39" y="12">next iteration</text></g>
  </g>

  <g class="motion">
    <circle class="packet" r="4" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M96 194H220H350H480H610H740H880"/></circle>
    <circle class="packet2" r="3"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M96 194H220H350H480H610H740H880"/></circle>
    <circle class="risk" r="3.5"><animateMotion dur="9s" begin="-2s" repeatCount="indefinite" path="M740 194C740 290 590 301 480 301S260 290 260 238"/></circle>
  </g>

  <g class="mono">
    <text class="micro" x="34" y="339">CURIOUS BY DEFAULT</text><text class="micro" x="250" y="339">DESIGN WITH INTENT</text><text class="micro" x="490" y="339">TEST THE EDGES</text><text class="micro" x="700" y="339">LEARN IN PUBLIC</text>
  </g>
</svg>
