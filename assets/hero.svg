<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Metehan Ulusoy — Computer Engineering student building software, AI experiments, and side projects">
  <title>Metehan Ulusoy — Building in public</title>
  <desc>Signal Ledger interface with a live project graph connecting software, design, AI, tools, and learning.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720"/><stop offset=".52" stop-color="#0B1119"/><stop offset="1" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#36F1CD" stop-opacity=".08"/>
      <stop offset=".42" stop-color="#36F1CD" stop-opacity=".92"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="45" y1="0" x2="510" y2="0">
      <stop offset="0" stop-color="#EAF2F8"/><stop offset=".64" stop-color="#EAF2F8"/><stop offset="1" stop-color="#64E8C1"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36F1CD" stop-opacity="0"/><stop offset=".5" stop-color="#36F1CD" stop-opacity=".34"/><stop offset="1" stop-color="#36F1CD" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36F1CD" stop-opacity=".25"/><stop offset=".58" stop-color="#8B5CF6" stop-opacity=".08"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#64E8C1" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="dot" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="panelClip"><rect x="1" y="1" width="998" height="328" rx="20"/></clipPath>
  </defs>
  <style>
    .panel{fill:url(#panel)} .border{fill:none;stroke:url(#edge);stroke-width:1.25}
    .grid{fill:url(#grid)} .name{font:760 50px -apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif;letter-spacing:1.8px;fill:url(#name)}
    .tagline{font:520 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif;fill:#B5C0CB}
    .mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}
    .micro{font-size:9.5px;font-weight:600;letter-spacing:1.5px;fill:#82909C}
    .signal{fill:#64E8C1}.violet{fill:#A78BFA}.line{fill:none;stroke:#64E8C1;stroke-opacity:.3;stroke-width:1.15}
    .line2{fill:none;stroke:#8B5CF6;stroke-opacity:.28;stroke-width:1}.ring{fill:none;stroke:#64E8C1;stroke-opacity:.22}
    .module{fill:#0D151E;stroke:#64E8C1;stroke-opacity:.38}.module2{fill:#101322;stroke:#A78BFA;stroke-opacity:.36}
    .module-text{font-size:8.5px;font-weight:650;letter-spacing:1px;fill:#B9C4CE}.core-label{font-size:11px;font-weight:700;letter-spacing:2px;fill:#EAF2F8}
    .chip{fill:#64E8C1;fill-opacity:.075;stroke:#64E8C1;stroke-opacity:.24}.chip2{fill:#8B5CF6;fill-opacity:.075;stroke:#8B5CF6;stroke-opacity:.23}
    .chip-text{font-size:8.5px;font-weight:650;letter-spacing:.9px;fill:#B8C3CD}.status{font-size:9px;font-weight:650;letter-spacing:1.25px;fill:#A9B4BE}
    .pulse{animation:pulse 3.2s ease-in-out infinite}.spin{transform-origin:795px 158px;animation:spin 18s linear infinite}.spin-back{transform-origin:795px 158px;animation:spinBack 26s linear infinite}
    .scan{animation:scan 8s ease-in-out infinite}.dash{stroke-dasharray:3 8;animation:dash 5s linear infinite}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}
    @keyframes scan{0%,12%{transform:translateX(-1000px);opacity:0}35%,65%{opacity:.5}88%,100%{transform:translateX(1000px);opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-44}}
    @media (prefers-color-scheme:light){
      .panel{fill:#F6F8FA}.grid{opacity:.52}.name{fill:#1F2328}.tagline{fill:#4D5761}.micro,.status{fill:#57606A}
      .module{fill:#FFFFFF}.module2{fill:#F8F5FF}.module-text{fill:#3F4852}.core-label{fill:#1F2328}.chip-text{fill:#3F4852}
      .line{stroke:#0F9F86;stroke-opacity:.42}.line2{stroke:#6D4BD6;stroke-opacity:.36}.ring{stroke:#0F9F86;stroke-opacity:.28}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
  </style>

  <rect class="panel" x="1" y="1" width="998" height="328" rx="20"/>
  <g clip-path="url(#panelClip)">
    <rect class="grid" x="540" y="1" width="459" height="328"/>
    <circle cx="795" cy="158" r="154" fill="url(#core)"/>
    <rect class="scan motion" x="-260" y="1" width="260" height="328" fill="url(#beam)" opacity="0"/>
    <path d="M540 42H970M540 279H970" class="line2 dash"/>
  </g>
  <rect class="border" x="1" y="1" width="998" height="328" rx="20"/>

  <g class="mono">
    <text class="micro" x="42" y="36">TRACE 00 / IDENTITY</text>
    <circle cx="212" cy="32.5" r="3" class="signal pulse"/>
    <text class="micro signal" x="222" y="36">SYSTEM ONLINE</text>
  </g>

  <g>
    <text class="name" x="42" y="106">METEHAN</text>
    <text class="name" x="42" y="161">ULUSOY</text>
    <text class="tagline" x="44" y="198">Building things, breaking things, learning in public.</text>
    <text class="micro mono" x="44" y="222">AI  /  SOFTWARE  /  DESIGN  /  SIDE PROJECTS</text>
  </g>

  <g class="mono">
    <g transform="translate(42 248)"><rect class="chip" width="104" height="27" rx="13.5"/><text class="chip-text" x="52" y="17.5" text-anchor="middle">SOFTWARE</text></g>
    <g transform="translate(154 248)"><rect class="chip2" width="128" height="27" rx="13.5"/><text class="chip-text" x="64" y="17.5" text-anchor="middle">WEB + DESIGN</text></g>
    <g transform="translate(290 248)"><rect class="chip" width="98" height="27" rx="13.5"/><text class="chip-text" x="49" y="17.5" text-anchor="middle">AI / ML</text></g>
  </g>

  <g class="mono">
    <text class="micro" x="580" y="36">PROJECT GRAPH / LIVE</text>
    <text class="micro" x="955" y="36" text-anchor="end">UTC+3</text>

    <g class="spin-back motion">
      <ellipse class="ring" cx="795" cy="158" rx="116" ry="62" stroke-dasharray="2 8"/>
      <circle cx="679" cy="158" r="3.5" class="signal"/><circle cx="911" cy="158" r="3.5" class="violet"/>
    </g>
    <g class="spin motion">
      <ellipse class="ring" cx="795" cy="158" rx="88" ry="108" stroke="#A78BFA" stroke-opacity=".17" stroke-dasharray="4 11"/>
      <circle cx="795" cy="50" r="3.5" class="violet"/><circle cx="795" cy="266" r="3.5" class="signal"/>
    </g>

    <path class="line" d="M795 158L795 82M795 158L872 111M795 158L888 183M795 158L850 237M795 158L745 239M795 158L702 185"/>
    <path class="line2" d="M795 82L872 111L888 183L850 237L745 239L702 185Z"/>

    <g transform="translate(795 82)"><rect class="module" x="-31" y="-12" width="62" height="24" rx="12"/><text class="module-text" y="3" text-anchor="middle">BUILD</text></g>
    <g transform="translate(872 111)"><rect class="module2" x="-27" y="-12" width="54" height="24" rx="12"/><text class="module-text" y="3" text-anchor="middle">WEB</text></g>
    <g transform="translate(888 183)"><rect class="module" x="-33" y="-12" width="66" height="24" rx="12"/><text class="module-text" y="3" text-anchor="middle">AI / ML</text></g>
    <g transform="translate(850 237)"><rect class="module2" x="-33" y="-12" width="66" height="24" rx="12"/><text class="module-text" y="3" text-anchor="middle">DESIGN</text></g>
    <g transform="translate(745 239)"><rect class="module" x="-31" y="-12" width="62" height="24" rx="12"/><text class="module-text" y="3" text-anchor="middle">TOOLS</text></g>
    <g transform="translate(702 185)"><rect class="module2" x="-31" y="-12" width="62" height="24" rx="12"/><text class="module-text" y="3" text-anchor="middle">LEARN</text></g>

    <g transform="translate(795 158)">
      <circle r="47" fill="url(#core)" class="pulse"/>
      <path d="M0-36L31-18V18L0 36-31 18V-18Z" fill="#0D151E" stroke="#64E8C1" stroke-opacity=".58"/>
      <path d="M0-25L22-13V13L0 25-22 13V-13Z" fill="none" stroke="#A78BFA" stroke-opacity=".42"/>
      <text class="core-label" y="4" text-anchor="middle">CREATE</text>
    </g>

    <g class="motion">
      <circle r="3" fill="#64E8C1" filter="url(#dot)"><animateMotion dur="8s" repeatCount="indefinite" path="M795 82L872 111L888 183L850 237L745 239L702 185L795 82"/></circle>
      <circle r="2.5" fill="#A78BFA"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M795 82L872 111L888 183L850 237L745 239L702 185L795 82"/></circle>
      <circle r="3" fill="#64E8C1"><animateMotion dur="3.4s" repeatCount="indefinite" path="M702 185L795 158L888 183"/></circle>
    </g>
  </g>

  <g class="mono">
    <circle cx="43" cy="304" r="3" class="signal pulse"/>
    <text class="status" x="54" y="307">COMPUTER ENGINEERING · BUILDING IN PUBLIC</text>
    <text class="status" x="956" y="307" text-anchor="end">BUILD / BREAK / LEARN / SHIP</text>
  </g>
</svg>
