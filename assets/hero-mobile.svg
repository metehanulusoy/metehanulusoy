<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-label="Metehan Ulusoy — building software, AI experiments, and side projects">
  <title>Metehan Ulusoy — Building in public</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101720"/><stop offset="1" stop-color="#070B10"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36F1CD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#36F1CD" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64E8C1" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .panel{fill:url(#panel)}.border{fill:none;stroke:url(#edge);stroke-width:1.4}.grid{fill:url(#grid)}
    .name{font:760 52px -apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif;letter-spacing:1px;fill:#EAF2F8}.tag{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif;fill:#B5C0CB}
    .mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.micro{font-size:12px;font-weight:650;letter-spacing:1.5px;fill:#82909C}.mint{fill:#64E8C1}
    .line{fill:none;stroke:#64E8C1;stroke-opacity:.34}.line2{fill:none;stroke:#8B5CF6;stroke-opacity:.32}.node{fill:#0D151E;stroke:#64E8C1;stroke-opacity:.45}.node2{fill:#101322;stroke:#8B5CF6;stroke-opacity:.44}
    .label{font-size:11px;font-weight:700;letter-spacing:1px;fill:#C5CFD8}.core-label{font-size:15px;font-weight:750;letter-spacing:2px;fill:#EAF2F8}.chip{fill:#64E8C1;fill-opacity:.07;stroke:#64E8C1;stroke-opacity:.25}.chip-text{font-size:11px;font-weight:650;letter-spacing:1px;fill:#B8C3CD}
    .pulse{animation:p 3s ease-in-out infinite}.spin{transform-origin:300px 484px;animation:s 20s linear infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@keyframes s{to{transform:rotate(360deg)}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.name,.core-label{fill:#1F2328}.tag{fill:#4D5761}.micro{fill:#57606A}.node{fill:#FFF}.node2{fill:#F8F5FF}.label,.chip-text{fill:#3F4852}.grid{opacity:.5}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
  </style>
  <rect class="panel" x="1" y="1" width="598" height="718" rx="20"/><rect class="grid" x="1" y="300" width="598" height="419" rx="20"/><rect class="border" x="1" y="1" width="598" height="718" rx="20"/>
  <text class="micro mono" x="30" y="38">TRACE 00 / IDENTITY</text><circle class="mint pulse" cx="242" cy="34" r="4"/><text class="micro mono mint" x="256" y="38">ONLINE</text>
  <text class="name" x="30" y="112">METEHAN</text><text class="name" x="30" y="171">ULUSOY</text>
  <text class="tag" x="32" y="215">Building things, breaking things,</text><text class="tag" x="32" y="240">learning in public.</text>
  <text class="micro mono" x="32" y="275">AI / SOFTWARE / DESIGN / SIDE PROJECTS</text>
  <g class="mono" transform="translate(31 302)"><rect class="chip" width="126" height="31" rx="15.5"/><text class="chip-text" x="63" y="20" text-anchor="middle">SOFTWARE</text></g>
  <g class="mono" transform="translate(166 302)"><rect class="chip" width="187" height="31" rx="15.5"/><text class="chip-text" x="93.5" y="20" text-anchor="middle">WEB + DESIGN</text></g>
  <g class="mono">
    <text class="micro" x="30" y="382">PROJECT GRAPH / LIVE</text>
    <circle cx="300" cy="484" r="132" fill="url(#core)"/>
    <g class="spin motion"><circle cx="300" cy="484" r="119" fill="none" stroke="#64E8C1" stroke-opacity=".2" stroke-dasharray="3 12"/><circle cx="300" cy="365" r="4" class="mint"/><circle cx="300" cy="603" r="4" fill="#A78BFA"/></g>
    <path class="line" d="M300 484L300 389M300 484L405 430M300 484L405 538M300 484L300 589M300 484L195 538M300 484L195 430"/>
    <path class="line2" d="M300 389L405 430L405 538L300 589L195 538L195 430Z"/>
    <g transform="translate(300 389)"><rect class="node" x="-39" y="-15" width="78" height="30" rx="15"/><text class="label" y="4" text-anchor="middle">BUILD</text></g>
    <g transform="translate(405 430)"><rect class="node2" x="-37" y="-15" width="74" height="30" rx="15"/><text class="label" y="4" text-anchor="middle">WEB</text></g>
    <g transform="translate(405 538)"><rect class="node" x="-43" y="-15" width="86" height="30" rx="15"/><text class="label" y="4" text-anchor="middle">AI / ML</text></g>
    <g transform="translate(300 589)"><rect class="node2" x="-43" y="-15" width="86" height="30" rx="15"/><text class="label" y="4" text-anchor="middle">DESIGN</text></g>
    <g transform="translate(195 538)"><rect class="node" x="-47" y="-15" width="94" height="30" rx="15"/><text class="label" y="4" text-anchor="middle">TOOLS</text></g>
    <g transform="translate(195 430)"><rect class="node2" x="-45" y="-15" width="90" height="30" rx="15"/><text class="label" y="4" text-anchor="middle">LEARN</text></g>
    <g transform="translate(300 484)"><path d="M0-47L40-24V24L0 47-40 24V-24Z" fill="#0D151E" stroke="#64E8C1" stroke-opacity=".6"/><text class="core-label" y="5" text-anchor="middle">CREATE</text></g>
    <g class="motion"><circle r="4" class="mint"><animateMotion dur="8s" repeatCount="indefinite" path="M300 389L405 430L405 538L300 589L195 538L195 430L300 389"/></circle></g>
  </g>
  <circle class="mint pulse" cx="31" cy="686" r="4"/><text class="micro mono" x="45" y="690">BUILDING IN PUBLIC · UTC+3</text>
</svg>
