<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 34" role="img" aria-label="Computer Engineering student. I own the whole loop: idea, design, build, ship">
  <style>
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif;font-size:18px}
    .base{fill:#c9d1d9}
    .k1{fill:#32F5C4;font-weight:700}
    .a{fill:#4DA3FF;font-weight:700}
    .b{fill:#8B5CF6;font-weight:700}
    .c{fill:#FF4ECD;font-weight:700}
    .d{fill:#FFD166;font-weight:700}
    .arrow{fill:#5c6b7a}
    @media(prefers-color-scheme:light){.base{fill:#3d4652}.arrow{fill:#8b949e}}
  </style>
  <text class="s base" x="350" y="24" text-anchor="middle"><tspan class="k1">Computer Engineering</tspan> student. I own the whole loop: <tspan class="a">idea</tspan> <tspan class="arrow">→</tspan> <tspan class="b">design</tspan> <tspan class="arrow">→</tspan> <tspan class="c">build</tspan> <tspan class="arrow">→</tspan> <tspan class="d">ship</tspan>.</text>
</svg>
