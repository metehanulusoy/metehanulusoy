<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 168" role="img" aria-label="Metehan Ulusoy — building things, breaking things, learning in public">
  <defs>
    <linearGradient id="np-sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#32F5C4"/><stop offset=".34" stop-color="#4DA3FF"/><stop offset=".67" stop-color="#FF4ECD"/><stop offset="1" stop-color="#32F5C4"/>
    </linearGradient>
    <linearGradient id="np-rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#32F5C4" stop-opacity="0"/><stop offset=".5" stop-color="#32F5C4" stop-opacity=".55"/><stop offset="1" stop-color="#FF4ECD" stop-opacity="0"/>
    </linearGradient>
    <mask id="np-mask">
      <text class="name sans" x="500" y="96" text-anchor="middle" fill="#ffffff">METEHAN ULUSOY</text>
    </mask>
    <clipPath id="np-type"><rect class="type" x="286" y="120" width="430" height="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}
    .mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}
    .name{font-size:54px;font-weight:850;letter-spacing:2px}
    .ghost{font-size:54px;font-weight:850;letter-spacing:2px;fill:#FF4ECD;opacity:.16}
    .micro{font-size:9px;font-weight:700;letter-spacing:2.4px;fill:#718092}
    .tag{font-size:13px;font-weight:650;letter-spacing:.2px;fill:#A8B4C0}
    .caret{fill:#32F5C4}
    /* Rest state is the fully typed line: the clip rect keeps its width attribute and the
       caret sits at the end. The animation only plays the reveal, so if motion is blocked
       or the renderer never advances it, the tagline still reads in full. */
    .sweep{animation:np-slide 7s linear infinite}
    .type{animation:np-type 3.6s steps(52) 1}
    .cursor{animation:np-walk 3.6s steps(52) 1,np-blink 1.05s step-end infinite}
    @keyframes np-slide{from{transform:translateX(0)}to{transform:translateX(520px)}}
    @keyframes np-type{from{width:0}to{width:430px}}
    @keyframes np-walk{from{transform:translateX(-430px)}to{transform:translateX(0)}}
    @keyframes np-blink{50%{opacity:0}}
    @media(prefers-color-scheme:light){.micro{fill:#57606A}.tag{fill:#4A5560}.ghost{opacity:.1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
  </style>
  <text class="micro mono" x="500" y="34" text-anchor="middle">PLAYER 01 / READY</text>
  <text class="ghost sans" x="503" y="99" text-anchor="middle">METEHAN ULUSOY</text>
  <g mask="url(#np-mask)"><rect class="sweep" x="-620" y="46" width="2240" height="66" fill="url(#np-sweep)"/></g>
  <path d="M300 116H700" stroke="url(#np-rule)" stroke-width="1"/>
  <g clip-path="url(#np-type)">
    <text class="tag mono" x="290" y="138">Building things, breaking things, learning in public.</text>
  </g>
  <g class="motion"><rect class="caret cursor" x="712" y="126" width="8" height="14"/></g>
</svg>
