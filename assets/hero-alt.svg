  <title>Metehan Ulusoy — AI Engineer</title>
  <style>
    .txt-name{font:700 44px -apple-system,"Segoe UI",Ubuntu,Roboto,sans-serif;letter-spacing:4px}
    .txt-role{font:500 15px "SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace;letter-spacing:8px;fill:#8B949E}
    .txt-type{font:400 14px "SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace;fill:#C9D1D9}
    .prompt{font:600 14px "SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace;fill:#A855F7}
    .cursor{fill:#A855F7;animation:blink 1.1s linear infinite}
    .node-p{fill:#A855F7}
    .node-b{fill:#7AA2F7}
    .np{animation:npulse 4.8s ease-in-out infinite}
    .edge{stroke:#7AA2F7;stroke-opacity:.28;stroke-width:1;fill:none}
    .edge.alt{stroke:#A855F7;stroke-opacity:.24}
    .pulse{fill:#C084FC}
    .part{fill:#A855F7;opacity:0;animation:drift 8s ease-in-out infinite}
    .p1{animation-duration:7.5s;animation-delay:-2s}
    .p2{animation-duration:9s;animation-delay:-5s}
    .p3{animation-duration:8.2s;animation-delay:-3.5s}
    .p4{animation-duration:7s;animation-delay:-1s}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes npulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes drift{0%{transform:translateY(0);opacity:0}12%{opacity:.6}75%{opacity:.35}100%{transform:translateY(-70px);opacity:0}}
    @media (prefers-color-scheme: light){
      .txt-role{fill:#57606A}
      .txt-type{fill:#1F2328}
      .prompt{fill:#7C3AED}
      .cursor{fill:#7C3AED}
      .edge{stroke:#7AA2F7;stroke-opacity:.45}
      .edge.alt{stroke:#7C3AED;stroke-opacity:.4}
      .pulse{fill:#7C3AED}
      .part{fill:#7C3AED}
    }
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
