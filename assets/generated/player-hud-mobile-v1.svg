<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Live GitHub player HUD for metehanulusoy">
  <title>DEV ARCADE — mobile player HUD</title><desc>Live GitHub totals and top language inventory.</desc>
  <defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#070A11"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36F1CD"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient><linearGradient id="xp" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36F1CD"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#60A5FA" stroke-opacity=".045"/></pattern></defs>
  <style>text{font-family:"SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace}.panel{fill:url(#panel)}.grid{fill:url(#grid)}.border{fill:none;stroke:url(#edge);stroke-width:1.5}.header{font-size:15px;font-weight:750;letter-spacing:1px;fill:#82909C}.name{font-size:28px;font-weight:850;fill:#EAF2F8}.class{font-size:16px;font-weight:750;letter-spacing:.8px;fill:#36F1CD}.tile{fill:#0C1420;stroke:var(--accent);stroke-opacity:.38}.label{font-size:15px;font-weight:750;letter-spacing:.7px;fill:#82909C}.value{font-size:34px;font-weight:850}.index{font-size:14px;font-weight:800}.pill{fill:#36F1CD;fill-opacity:.07;stroke:#36F1CD;stroke-opacity:.32}.p1{stroke:#60A5FA}.p2{stroke:#FF4ECD}.p3{stroke:#FFD166}.pill-text{font-size:14px;font-weight:700;fill:#C8D3DD}.avatar-body{fill:#60A5FA;stroke:#080B12;stroke-width:3}.avatar-head{fill:#FFD166;stroke:#080B12;stroke-width:3}.limb{fill:none;stroke:#36F1CD;stroke-width:6}.arm{fill:none;stroke:#FF4ECD;stroke-width:5}.avatar{animation:bob 2.4s ease-in-out infinite}.live{fill:#36F1CD;animation:pulse 2.2s ease-in-out infinite}.xp-bg{fill:#14202B}.xp{fill:url(#xp);animation:xp 6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes xp{0%{width:90px}60%,100%{width:630px}}@media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.name{fill:#1F2328}.header,.label{fill:#57606A}.tile{fill:#FFFFFF}.pill-text{fill:#344252}.grid{opacity:.55}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect class="panel" x="1" y="1" width="718" height="518" rx="20"/><rect class="grid" x="1" y="1" width="718" height="518" rx="20"/><rect class="border" x="1" y="1" width="718" height="518" rx="20"/>
  <text class="header" x="30" y="38">PLAYER_HUD.JSON / LIVE</text><circle class="live" cx="258" cy="34" r="4"/><text class="header" x="690" y="38" text-anchor="end">2026-08-02</text><path d="M30 57H690" stroke="#334155"/>
  <g transform="translate(78 116)"><g class="avatar"><rect class="avatar-head" x="-17" y="-45" width="34" height="27" rx="5"/><rect x="-9" y="-36" width="5" height="5"/><rect x="4" y="-36" width="5" height="5"/><rect class="avatar-body" x="-22" y="-16" width="44" height="36" rx="4"/><path class="limb" d="M-11 20v19h-11M11 20v19h11"/><path class="arm" d="M-22-8h-13v20M22-8h13v20"/></g></g><text class="name" x="135" y="102">metehanulusoy@github</text><text class="class" x="135" y="127">GENERALIST BUILDER / ONLINE</text><text class="header" x="135" y="151">LEARN → BUILD → BREAK → SHIP</text>
  <g transform="translate(30 178)"><g class="metric m0"><rect class="tile" width="316" height="98" rx="10" style="--accent:#36F1CD"/><text class="label" x="18" y="28">PUBLIC QUESTS</text><text class="value" x="18" y="70" fill="#36F1CD">24</text><text class="index" x="292" y="28" text-anchor="end" fill="#36F1CD">01</text></g></g><g transform="translate(362 178)"><g class="metric m1"><rect class="tile" width="316" height="98" rx="10" style="--accent:#60A5FA"/><text class="label" x="18" y="28">TOTAL XP</text><text class="value" x="18" y="70" fill="#60A5FA">177</text><text class="index" x="292" y="28" text-anchor="end" fill="#60A5FA">02</text></g></g><g transform="translate(30 294)"><g class="metric m2"><rect class="tile" width="316" height="98" rx="10" style="--accent:#FF4ECD"/><text class="label" x="18" y="28">COMMITS / 2026</text><text class="value" x="18" y="70" fill="#FF4ECD">147</text><text class="index" x="292" y="28" text-anchor="end" fill="#FF4ECD">03</text></g></g><g transform="translate(362 294)"><g class="metric m3"><rect class="tile" width="316" height="98" rx="10" style="--accent:#FFD166"/><text class="label" x="18" y="28">PLAYER SINCE</text><text class="value" x="18" y="70" fill="#FFD166">2025</text><text class="index" x="292" y="28" text-anchor="end" fill="#FFD166">04</text></g></g>
  <text class="header" x="30" y="430">INVENTORY / TOP LANGUAGES</text><g transform="translate(30 446)"><rect class="pill p0" width="77" height="32" rx="16"/><text class="pill-text" x="38.5" y="21" text-anchor="middle">Python</text></g><g transform="translate(117 446)"><rect class="pill p1" width="109" height="32" rx="16"/><text class="pill-text" x="54.5" y="21" text-anchor="middle">TypeScript</text></g><g transform="translate(236 446)"><rect class="pill p2" width="76" height="32" rx="16"/><text class="pill-text" x="38.0" y="21" text-anchor="middle">HTML</text></g><g transform="translate(322 446)"><rect class="pill p3" width="76" height="32" rx="16"/><text class="pill-text" x="38.0" y="21" text-anchor="middle">CSS</text></g>
  <rect class="xp-bg" x="30" y="495" width="660" height="9" rx="4.5"/><rect class="xp" x="30" y="495" width="630" height="9" rx="4.5"/>
</svg>