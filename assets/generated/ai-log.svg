<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" role="img" aria-label="ai-log: Just pushed some code and fixed a few issues—business as usual. 🚀">
  <title>ai-log — daily status written by an LLM pipeline</title>
  <desc>Just pushed some code and fixed a few issues—business as usual. 🚀</desc>
  <style>
    text { font-family: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace; }
    .prompt { fill: #A855F7; font-weight: 600; }
    .status { fill: #C9D1D9; }
    .meta   { fill: #8B949E; }
    .cursor { fill: #A855F7; }
    #type-rect {
      transform-origin: 120px 0px;
      animation: type 30s linear infinite;
    }
    #cursor {
      animation: cur-move 30s linear infinite, cur-blink 1.1s linear infinite;
    }
    @keyframes type {
      0%   { transform: scaleX(0); animation-timing-function: steps(65, end); }
      10%  { transform: scaleX(1); }
      100% { transform: scaleX(1); }
    }
    @keyframes cur-move {
      0%   { transform: translateX(-559.4px); animation-timing-function: steps(65, end); }
      10%  { transform: translateX(0px); }
      100% { transform: translateX(0px); }
    }
    @keyframes cur-blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: light) {
      .prompt, .cursor { fill: #7C3AED; }
      .status { fill: #1F2328; }
      .meta   { fill: #6E7781; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="type-clip">
      <rect id="type-rect" x="120" y="18" width="568.4" height="34"/>
    </clipPath>
  </defs>
  <text class="prompt" x="12" y="40" font-size="14">🤖 ai-log $</text>
  <text class="status" x="122" y="40" font-size="14" textLength="554.4" lengthAdjust="spacing" clip-path="url(#type-clip)">Just pushed some code and fixed a few issues—business as usual. 🚀</text>
  <rect id="cursor" class="cursor" x="681.4" y="28" width="7" height="16" rx="1"/>
  <text class="meta" x="12" y="70" font-size="10">generated daily by an LLM pipeline · last run: 2026-07-24 UTC</text>
</svg>
