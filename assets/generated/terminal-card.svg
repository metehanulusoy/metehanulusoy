<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-label="Live GitHub release ledger for metehanulusoy: 24 public repositories and 177 contributions">
  <title>Release Ledger — live GitHub telemetry</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E151E"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop stop-color="#36F1CD" stop-opacity=".72"/><stop offset=".55" stop-color="#60A5FA" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".72"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#64E8C1" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    text{font-family:"SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace}.panel{fill:url(#panel);stroke:#33404C}.grid{fill:url(#grid)}
    .header{font-size:10px;font-weight:650;letter-spacing:1.5px;fill:#82909C}.live{fill:#64E8C1}
    .tile{fill:#36F1CD;fill-opacity:.035;stroke:#36F1CD;stroke-opacity:.13}.label{font-size:9px;font-weight:650;letter-spacing:1.15px;fill:#82909C}
    .value{font-size:26px;font-weight:720;fill:#EAF2F8}.index{font-size:8px;font-weight:650;fill:#36F1CD;opacity:.7}
    .pill{fill:#36F1CD;fill-opacity:.07;stroke:#36F1CD;stroke-opacity:.2}.pill-text{font-size:10px;font-weight:650;fill:#BAC5CF}
    .signal{fill:none;stroke:url(#edge);stroke-width:1.2;stroke-dasharray:4 10;animation:flow 4s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}.metric{animation:reveal 30s ease-out infinite}.m1{animation-delay:.12s}.m2{animation-delay:.24s}.m3{animation-delay:.36s}
    @keyframes flow{to{stroke-dashoffset:-56}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes reveal{0%{opacity:0}4%,100%{opacity:1}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA;stroke:#D0D7DE}.grid{opacity:.5}.header,.label{fill:#57606A}.value{fill:#1F2328}.pill-text{fill:#3F4852}.tile{fill:#FFFFFF;stroke-opacity:.22}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
  </style>
  <rect class="panel" x="1" y="1" width="998" height="228" rx="16"/><rect class="grid" x="1" y="1" width="998" height="228" rx="16"/>
  <text class="header" x="26" y="31">RELEASE LEDGER / LIVE GITHUB SIGNAL</text><circle class="live pulse" cx="275" cy="27.5" r="3"/>
  <text class="header" x="974" y="31" text-anchor="end">SYNC / 2026-08-02 UTC</text>
  <g class="metric m0" transform="translate(26 60)"><rect class="tile" width="226" height="88" rx="12"/><text class="label" x="18" y="27">PUBLIC REPOS</text><text class="value" x="18" y="66">24</text><text class="index" x="204" y="27" text-anchor="end">01</text></g><g class="metric m1" transform="translate(265 60)"><rect class="tile" width="226" height="88" rx="12"/><text class="label" x="18" y="27">CONTRIBUTIONS</text><text class="value" x="18" y="66">177</text><text class="index" x="204" y="27" text-anchor="end">02</text></g><g class="metric m2" transform="translate(504 60)"><rect class="tile" width="226" height="88" rx="12"/><text class="label" x="18" y="27">COMMITS / 2026</text><text class="value" x="18" y="66">147</text><text class="index" x="204" y="27" text-anchor="end">03</text></g><g class="metric m3" transform="translate(743 60)"><rect class="tile" width="226" height="88" rx="12"/><text class="label" x="18" y="27">ACCOUNT SINCE</text><text class="value" x="18" y="66">2025</text><text class="index" x="204" y="27" text-anchor="end">04</text></g>
  <path class="signal" d="M26 211H974"/>
  <text class="header" x="26" y="190">LANGUAGE VECTOR</text>
  <g transform="translate(190 172)"><rect class="pill" width="74" height="27" rx="13.5"/><text class="pill-text" x="37.0" y="18" text-anchor="middle">Python</text></g><g transform="translate(274 172)"><rect class="pill" width="106" height="27" rx="13.5"/><text class="pill-text" x="53.0" y="18" text-anchor="middle">TypeScript</text></g><g transform="translate(390 172)"><rect class="pill" width="70" height="27" rx="13.5"/><text class="pill-text" x="35.0" y="18" text-anchor="middle">HTML</text></g><g transform="translate(470 172)"><rect class="pill" width="70" height="27" rx="13.5"/><text class="pill-text" x="35.0" y="18" text-anchor="middle">CSS</text></g>
  <text class="header" x="974" y="190" text-anchor="end">309 DAYS ON GITHUB</text>
  <g class="motion"><circle r="3" fill="#36F1CD" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M26 211H974"/></circle><circle r="2.5" fill="#8B5CF6"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M26 211H974"/></circle></g>
</svg>