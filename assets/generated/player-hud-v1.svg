<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Live GitHub player HUD for metehanulusoy: 24 public quests and 177 total contributions">
  <title>DEV ARCADE — live GitHub player HUD</title>
  <desc>Live public repository, contribution and commit totals generated daily from GitHub.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#070A11"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36F1CD"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36F1CD"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#60A5FA" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    text{font-family:"SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace}.panel{fill:url(#panel)}.grid{fill:url(#grid)}.border{fill:none;stroke:url(#edge);stroke-width:1.3}
    .header{font-size:9px;font-weight:750;letter-spacing:1.4px;fill:#82909C}.name{font-size:17px;font-weight:850;fill:#EAF2F8}.class{font-size:9px;font-weight:750;letter-spacing:1px;fill:#36F1CD}
    .tile{fill:#0C1420;stroke:var(--accent);stroke-opacity:.35}.label{font-size:8px;font-weight:750;letter-spacing:1px;fill:#82909C}.value{font-size:24px;font-weight:850}.index{font-size:8px;font-weight:800}
    .pill{fill:#36F1CD;fill-opacity:.07;stroke:#36F1CD;stroke-opacity:.32}.p1{stroke:#60A5FA}.p2{stroke:#FF4ECD}.p3{stroke:#FFD166}.pill-text{font-size:9px;font-weight:700;fill:#C8D3DD}
    .avatar-body{fill:#60A5FA;stroke:#080B12;stroke-width:3}.avatar-head{fill:#FFD166;stroke:#080B12;stroke-width:3}.limb{fill:none;stroke:#36F1CD;stroke-width:6}.arm{fill:none;stroke:#FF4ECD;stroke-width:5}.avatar{animation:bob 2.4s ease-in-out infinite}.spark{animation:spark 1.8s steps(2,end) infinite}.live{fill:#36F1CD;animation:pulse 2.2s ease-in-out infinite}
    .xp-bg{fill:#14202B}.xp{fill:url(#xp);animation:xp 6s ease-in-out infinite}.flow{fill:none;stroke:url(#edge);stroke-dasharray:5 7;animation:flow 3s linear infinite}.metric{animation:reveal 16s ease-out infinite}.m1{animation-delay:.12s}.m2{animation-delay:.24s}.m3{animation-delay:.36s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes xp{0%{width:90px}60%,100%{width:310px}}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes reveal{0%{opacity:.2;transform:translateY(4px)}5%,100%{opacity:1;transform:none}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.name{fill:#1F2328}.header,.label{fill:#57606A}.tile{fill:#FFFFFF}.pill-text{fill:#344252}.grid{opacity:.55}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect class="panel" x="1" y="1" width="998" height="258" rx="16"/><rect class="grid" x="1" y="1" width="998" height="258" rx="16"/><rect class="border" x="1" y="1" width="998" height="258" rx="16"/>
  <text class="header" x="26" y="30">PLAYER_HUD.JSON / LIVE GITHUB</text><circle class="live" cx="260" cy="26" r="3"/><text class="header" x="974" y="30" text-anchor="end">AUTO-SAVE / 2026-08-02 UTC</text><path d="M26 45H974" stroke="#334155"/>
  <g transform="translate(91 112)"><g class="avatar"><rect class="avatar-head" x="-18" y="-57" width="36" height="29" rx="5"/><rect x="-10" y="-48" width="5" height="5"/><rect x="5" y="-48" width="5" height="5"/><path d="M-9-37H9" stroke="#080B12" stroke-width="3"/><rect class="avatar-body" x="-23" y="-25" width="46" height="40" rx="4"/><path class="limb" d="M-12 15v24h-12M12 15v24h12"/><path class="arm" d="M-23-16h-15v22M23-16h15v22"/><g class="spark"><rect x="31" y="-53" width="5" height="16" fill="#36F1CD"/><rect x="25" y="-47" width="17" height="5" fill="#36F1CD"/></g></g></g>
  <text class="name" x="153" y="89">metehanulusoy@github</text><text class="class" x="153" y="111">CLASS / GENERALIST BUILDER</text><text class="header" x="153" y="136">CURRENT QUEST</text><text class="class" x="153" y="157">LEARN → BUILD → BREAK → SHIP</text>
  <text class="header" x="26" y="203">INVENTORY / TOP LANGUAGES</text><g transform="translate(26 216)"><rect class="pill p0" width="68" height="26" rx="13"/><text class="pill-text" x="34.0" y="18" text-anchor="middle">Python</text></g><g transform="translate(102 216)"><rect class="pill p1" width="94" height="26" rx="13"/><text class="pill-text" x="47.0" y="18" text-anchor="middle">TypeScript</text></g><g transform="translate(204 216)"><rect class="pill p2" width="68" height="26" rx="13"/><text class="pill-text" x="34.0" y="18" text-anchor="middle">HTML</text></g><g transform="translate(280 216)"><rect class="pill p3" width="68" height="26" rx="13"/><text class="pill-text" x="34.0" y="18" text-anchor="middle">CSS</text></g>
  <path class="flow" d="M365 58V226"/><g transform="translate(390 58)"><g class="metric m0"><rect class="tile" width="278" height="78" rx="10" style="--accent:#36F1CD"/><text class="label" x="16" y="24">PUBLIC QUESTS</text><text class="value" x="16" y="59" fill="#36F1CD">24</text><text class="index" x="254" y="24" text-anchor="end" fill="#36F1CD">01</text></g></g><g transform="translate(684 58)"><g class="metric m1"><rect class="tile" width="278" height="78" rx="10" style="--accent:#60A5FA"/><text class="label" x="16" y="24">TOTAL XP</text><text class="value" x="16" y="59" fill="#60A5FA">177</text><text class="index" x="254" y="24" text-anchor="end" fill="#60A5FA">02</text></g></g><g transform="translate(390 142)"><g class="metric m2"><rect class="tile" width="278" height="78" rx="10" style="--accent:#FF4ECD"/><text class="label" x="16" y="24">COMMITS / 2026</text><text class="value" x="16" y="59" fill="#FF4ECD">147</text><text class="index" x="254" y="24" text-anchor="end" fill="#FF4ECD">03</text></g></g><g transform="translate(684 142)"><g class="metric m3"><rect class="tile" width="278" height="78" rx="10" style="--accent:#FFD166"/><text class="label" x="16" y="24">PLAYER SINCE</text><text class="value" x="16" y="59" fill="#FFD166">2025</text><text class="index" x="254" y="24" text-anchor="end" fill="#FFD166">04</text></g></g>
  <rect class="xp-bg" x="390" y="238" width="584" height="8" rx="4"/><rect class="xp" x="390" y="238" width="560" height="8" rx="4"/><text class="header" x="390" y="229">XP / CURIOSITY + CONSISTENCY</text><text class="header" x="974" y="229" text-anchor="end">309 DAYS ONLINE</text>
</svg>