<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="Build, break, learn, ship — AI and LLM systems, RAG, caching, evaluation, web and product, automation that sticks">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
        .wrap{height:44px;overflow:hidden;position:relative;
              font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}
        /* two identical copies side by side; shifting by exactly half the track
           length makes the loop seamless with no visible jump */
        .track{position:absolute;top:0;left:0;display:flex;white-space:nowrap;
               height:44px;align-items:center;animation:slide 26s linear infinite}
        .run{font-size:13px;font-weight:700;letter-spacing:2.4px;padding-right:44px}
        .t1{color:#32F5C4}.t2{color:#4DA3FF}.t3{color:#FF4ECD}.t4{color:#FFD166}
        .sep{color:#4b5563;padding:0 14px}
        @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        /* at rest the first copy already fills the strip, so stopping the animation
           leaves a readable line rather than an empty bar */
        @media(prefers-reduced-motion:reduce){.track{animation:none}}
      </style>
      <div class="track">
        <div class="run"><span class="t1">BUILD</span><span class="sep">→</span><span class="t2">BREAK</span><span class="sep">→</span><span class="t3">LEARN</span><span class="sep">→</span><span class="t4">SHIP</span><span class="sep">·</span><span class="t2">AI &amp; LLM SYSTEMS</span><span class="sep">·</span><span class="t1">RAG · CACHING · EVALUATION</span><span class="sep">·</span><span class="t3">WEB &amp; PRODUCT</span><span class="sep">·</span><span class="t4">AUTOMATION THAT STICKS</span><span class="sep">·</span></div>
        <div class="run"><span class="t1">BUILD</span><span class="sep">→</span><span class="t2">BREAK</span><span class="sep">→</span><span class="t3">LEARN</span><span class="sep">→</span><span class="t4">SHIP</span><span class="sep">·</span><span class="t2">AI &amp; LLM SYSTEMS</span><span class="sep">·</span><span class="t1">RAG · CACHING · EVALUATION</span><span class="sep">·</span><span class="t3">WEB &amp; PRODUCT</span><span class="sep">·</span><span class="t4">AUTOMATION THAT STICKS</span><span class="sep">·</span></div>
      </div>
    </div>
  </foreignObject>
</svg>
