<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="bug-mobile-title bug-mobile-desc">
  <title id="bug-mobile-title">Bug Hunt — mobile developer side quest</title>
  <desc id="bug-mobile-desc">A mobile-friendly animated pixel quest follows an idea through code, bug discovery, debugging, testing and shipping, then unlocks a reward.</desc>
  <defs>
    <linearGradient id="bm-panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset=".58" stop-color="#090E18"/><stop offset="1" stop-color="#070A11"/></linearGradient>
    <linearGradient id="bm-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32F5C4"/><stop offset=".45" stop-color="#4DA3FF"/><stop offset=".73" stop-color="#FF4ECD"/><stop offset="1" stop-color="#FFD166"/></linearGradient>
    <linearGradient id="bm-progress" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32F5C4"/><stop offset=".52" stop-color="#4DA3FF"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient>
    <pattern id="bm-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#4DA3FF" stroke-opacity=".052"/></pattern>
    <pattern id="bm-scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#EDF6FF" stroke-opacity=".018"/></pattern>
    <clipPath id="bm-clip"><rect x="1" y="1" width="718" height="558" rx="17"/></clipPath>
    <clipPath id="bm-track-clip"><rect x="23" y="75" width="674" height="318" rx="12"/></clipPath>
    <g id="bm-player">
      <rect x="-10" y="-26" width="20" height="17" rx="2" fill="#FFD166" stroke="#080B12" stroke-width="2.4"/>
      <rect x="-6" y="-21" width="3" height="3" fill="#080B12"/><rect x="3" y="-21" width="3" height="3" fill="#080B12"/>
      <path d="M-5-14h10" stroke="#080B12" stroke-width="2"/>
      <path d="M-13-7h26v20h-26z" fill="#4DA3FF" stroke="#080B12" stroke-width="2.4"/>
      <path d="M-7 0l5 4-5 4M7 0L2 4l5 4" fill="none" stroke="#EDF6FF" stroke-width="1.8"/>
      <path class="bm-legs" d="M-7 13v11h-6M7 13v11h6" fill="none" stroke="#32F5C4" stroke-width="5" stroke-linecap="square"/>
      <path d="M-13-2h-7v12M13-2h7v12" fill="none" stroke="#FF4ECD" stroke-width="4.2"/>
    </g>
    <g id="bm-bug" fill="#FF6B6B" stroke="#080B12" stroke-width="2">
      <rect x="-12" y="-10" width="24" height="20" rx="4"/><rect x="-7" y="-5" width="4" height="4" fill="#080B12"/><rect x="3" y="-5" width="4" height="4" fill="#080B12"/>
      <path d="M-12-4h-8M12-4h8M-12 5h-8M12 5h8M-6-10l-6-7M6-10l6-7" fill="none" stroke="#FF6B6B" stroke-width="4"/>
    </g>
    <g id="bm-trophy">
      <path d="M-18-21h36v11c0 17-9 27-18 27s-18-10-18-27z" fill="#FFD166" stroke="#080B12" stroke-width="3.5"/>
      <path d="M-18-14h-11v7c0 10 6 15 15 15M18-14h11v7c0 10-6 15-15 15" fill="none" stroke="#FFD166" stroke-width="6"/>
      <path d="M0 17v12M-15 33h30" stroke="#FFD166" stroke-width="7"/><path d="M0-14l4 7 8 1-6 5 2 8-8-4-8 4 2-8-6-5 8-1z" fill="#080B12"/>
    </g>
  </defs>
  <style>
    .bm-bg{fill:url(#bm-panel)}.bm-border{fill:none;stroke:url(#bm-edge);stroke-width:1.5}.bm-grid{fill:url(#bm-grid)}.bm-scanlines{fill:url(#bm-scan)}
    .bm-mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.bm-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}
    .bm-top{font-size:15px;font-weight:800;letter-spacing:1.15px;fill:#C5D0DA}.bm-micro{font-size:14px;font-weight:750;letter-spacing:.9px;fill:#82909C}.bm-section{font-size:16px;font-weight:850;letter-spacing:1px;fill:#B8C4CE}
    .bm-track{fill:#080D16;stroke:#334155}.bm-award{fill:#0C121D;stroke:#334155}.bm-route{fill:none;stroke:#283649;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.bm-route-live{fill:none;stroke:url(#bm-progress);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 9}
    .bm-node{fill:#111A27;stroke:#4DA3FF;stroke-width:1.7}.bm-node-pink{fill:#171225;stroke:#FF4ECD;stroke-width:1.7}.bm-node-warn{fill:#231416;stroke:#FF6B6B;stroke-width:1.7}.bm-node-ship{fill:#101D1C;stroke:#32F5C4;stroke-width:1.7}
    .bm-node-id{font-size:13px;font-weight:850;letter-spacing:.7px;fill:#738396}.bm-node-title{font-size:16px;font-weight:900;letter-spacing:.45px;fill:#EDF6FF}.bm-node-sub{font-size:13px;font-weight:750;fill:#8593A1}.bm-caption{font-size:14px;font-weight:750;letter-spacing:.45px;fill:#A9B6C2}
    .bm-mint{fill:#32F5C4}.bm-blue{fill:#4DA3FF}.bm-pink{fill:#FF4ECD}.bm-yellow{fill:#FFD166}.bm-coral{fill:#FF6B6B}
    .bm-toast-title{font-size:14px;font-weight:850;letter-spacing:1px;fill:#32F5C4}.bm-award-title{font-size:29px;font-weight:900;fill:#EDF6FF}.bm-xp{font-size:18px;font-weight:900;fill:#FFD166}.bm-log{font-size:13px;font-weight:750;letter-spacing:.75px;fill:#A9B6C2}
    .bm-dash{animation:bm-dash 1.3s linear infinite}.bm-bug-hop{transform-box:fill-box;transform-origin:center;animation:bm-bug-hop .85s steps(2,end) infinite}.bm-alert{transform-box:fill-box;transform-origin:center;animation:bm-alert 1.35s ease-in-out infinite}.bm-toast{transform-box:fill-box;transform-origin:center;animation:bm-toast 4.5s ease-in-out infinite}.bm-spark-a{animation:bm-spark-a 1.8s ease-in-out infinite}.bm-spark-b{animation:bm-spark-b 1.8s .55s ease-in-out infinite}.bm-spark-c{animation:bm-spark-c 1.8s 1.05s ease-in-out infinite}.bm-legs{animation:bm-legs .3s steps(2,end) infinite}.bm-cursor{animation:bm-cursor .9s steps(1,end) infinite}.bm-static{display:none}
    @keyframes bm-dash{to{stroke-dashoffset:-38}}@keyframes bm-bug-hop{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-7px) rotate(4deg)}}@keyframes bm-alert{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:.9;transform:scale(1.14)}}@keyframes bm-toast{0%,12%,88%,100%{transform:translateY(2px)}20%,80%{transform:translateY(-2px)}}
    @keyframes bm-spark-a{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(-7px,-8px);opacity:1}}@keyframes bm-spark-b{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(8px,-5px);opacity:1}}@keyframes bm-spark-c{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(4px,8px);opacity:1}}@keyframes bm-legs{0%{stroke-dasharray:16 8}100%{stroke-dasharray:7 5}}@keyframes bm-cursor{0%,52%{opacity:1}53%,100%{opacity:.18}}
    @media(prefers-color-scheme:light){.bm-bg{fill:#F6F8FA}.bm-track,.bm-award{fill:#FFFFFF}.bm-grid{opacity:.48}.bm-scanlines{opacity:.14}.bm-top,.bm-section,.bm-log{fill:#475569}.bm-micro,.bm-caption,.bm-node-id,.bm-node-sub{fill:#64748B}.bm-node-title,.bm-award-title{fill:#172033}.bm-node{fill:#F4F9FF}.bm-node-pink{fill:#FFF5FC}.bm-node-warn{fill:#FFF6F4}.bm-node-ship{fill:#F1FFFA}.bm-route{stroke:#D7E0EA}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.bm-motion{display:none!important}.bm-static{display:inline}}
  </style>
  <rect class="bm-bg" x="1" y="1" width="718" height="558" rx="17"/>
  <g clip-path="url(#bm-clip)"><rect class="bm-grid" x="1" y="1" width="718" height="558"/><rect class="bm-scanlines" x="1" y="1" width="718" height="558"/></g><rect class="bm-border" x="1" y="1" width="718" height="558" rx="17"/>

  <g class="bm-mono"><text class="bm-top" x="24" y="30">BUG_HUNT.EXE</text><rect x="155" y="16" width="90" height="20" rx="10" fill="#32F5C4" fill-opacity=".1" stroke="#32F5C4" stroke-opacity=".42"/><circle class="bm-mint bm-cursor" cx="170" cy="26" r="3.4"/><text class="bm-micro" x="180" y="30">RUNNING</text><text class="bm-top" x="696" y="30" text-anchor="end">QUEST 01</text></g>
  <path d="M21 49H699" stroke="#334155"/>

  <g class="bm-mono">
    <rect class="bm-track" x="22" y="66" width="676" height="328" rx="12"/><text class="bm-section" x="43" y="92">MISSION ROUTE</text><text class="bm-micro" x="677" y="92" text-anchor="end">FIX → VERIFY → DEPLOY</text><path d="M42 105H678" stroke="#273548"/>
    <g clip-path="url(#bm-track-clip)">
      <path class="bm-route" d="M108 168H606V301H108"/>
      <path class="bm-route-live bm-dash bm-motion" d="M108 168H606V301H108"/>
      <path class="bm-route-live bm-static" d="M108 168H606V301H108" stroke-dasharray="0"/>
      <g class="bm-motion motion" opacity=".7"><circle r="3.5" fill="#32F5C4"><animateMotion dur="5.2s" repeatCount="indefinite" path="M108 168H606V301H108"/></circle><circle r="3" fill="#FF4ECD"><animateMotion begin="-1.9s" dur="5.2s" repeatCount="indefinite" path="M108 168H606V301H108"/></circle></g>
    </g>

    <g transform="translate(54 123)"><rect class="bm-node" width="108" height="54" rx="7"/><text class="bm-node-id" x="11" y="17">STAGE 01</text><text class="bm-node-title" x="11" y="37">IDEA / CODE</text><circle class="bm-blue" cx="94" cy="15" r="3.5"/></g>
    <g transform="translate(251 123)"><rect class="bm-node-warn" width="108" height="54" rx="7"/><text class="bm-node-id" x="11" y="17">STAGE 02</text><text class="bm-node-title" x="11" y="37">BUG FOUND</text><path d="M92 10l8 14H84z" fill="#FF6B6B"/><path d="M92 15v5M92 22v1" stroke="#080B12" stroke-width="1.6"/></g>
    <g transform="translate(552 123)"><rect class="bm-node-pink" width="108" height="54" rx="7"/><text class="bm-node-id" x="11" y="17">STAGE 03</text><text class="bm-node-title" x="11" y="37">DEBUG</text><text class="bm-pink" x="94" y="24" text-anchor="middle" font-size="15">⌁</text></g>
    <g transform="translate(402 278)"><rect class="bm-node" width="108" height="54" rx="7"/><text class="bm-node-id" x="11" y="17">STAGE 04</text><text class="bm-node-title" x="11" y="37">TEST</text><path d="M86 20l4 4 9-10" fill="none" stroke="#32F5C4" stroke-width="2.4"/></g>
    <g transform="translate(54 278)"><rect class="bm-node-ship" width="108" height="54" rx="7"/><text class="bm-node-id" x="11" y="17">STAGE 05</text><text class="bm-node-title" x="11" y="37">SHIP</text><path d="M85 25l13-8-5 14-3-5-5 3z" fill="#32F5C4"/></g>

    <g transform="translate(108 212)"><circle r="15" fill="#111A27" stroke="#4DA3FF" stroke-width="2"/><text class="bm-caption" y="3.5" text-anchor="middle">&lt;/&gt;</text></g>
    <g transform="translate(305 212)"><g class="bm-bug-hop"><use href="#bm-bug"/></g></g>
    <g transform="translate(606 212)"><circle class="bm-alert" r="25" fill="#FF4ECD" opacity=".17"/><circle r="15" fill="#171225" stroke="#FF4ECD" stroke-width="2"/><text class="bm-caption" y="3.5" text-anchor="middle">{ }</text></g>
    <g transform="translate(456 350)"><circle r="15" fill="#101D1C" stroke="#32F5C4" stroke-width="2"/><path d="M-7 0l4 4 9-10" fill="none" stroke="#32F5C4" stroke-width="2.2"/></g>
    <g transform="translate(108 350)"><circle r="15" fill="#101D1C" stroke="#32F5C4" stroke-width="2"/><path d="M-6 5V-6l13 6z" fill="#32F5C4"/></g>
    <g class="bm-motion motion" clip-path="url(#bm-track-clip)"><g><use href="#bm-player"/><animateMotion dur="8.2s" repeatCount="indefinite" keyTimes="0;.22;.43;.63;.82;1" keyPoints="0;.22;.43;.63;.82;1" calcMode="linear" path="M108 211 C168 195 245 195 305 211 S524 228 606 211 L606 300 C606 332 510 344 456 348 S199 365 108 348"/></g></g>
    <g class="bm-static" transform="translate(606 211)"><use href="#bm-player"/></g>
    <text class="bm-micro" x="43" y="376">5 / 5 CHECKPOINTS  ·  BUILD → BREAK → FIX → SHIP</text>
  </g>

  <g class="bm-mono bm-toast">
    <rect class="bm-award" x="22" y="412" width="676" height="108" rx="12"/><g transform="translate(83 463)"><circle r="38" fill="#FFD166" opacity=".08"/><circle class="bm-motion motion" r="31" fill="none" stroke="#FFD166" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle><use href="#bm-trophy"/></g>
    <g transform="translate(46 435)"><g class="bm-spark-a"><rect class="bm-pink" width="5" height="5"/></g></g><g transform="translate(117 428)"><g class="bm-spark-b"><rect class="bm-mint" width="5" height="5"/></g></g><g transform="translate(124 487)"><g class="bm-spark-c"><rect class="bm-blue" width="5" height="5"/></g></g>
    <text class="bm-toast-title" x="148" y="442">ACHIEVEMENT UNLOCKED</text><text class="bm-award-title bm-sans" x="148" y="477">SHIP IT!</text><text class="bm-xp" x="283" y="477">+120 XP</text><text class="bm-caption" x="148" y="499">BUG FIXED  ·  TESTS GREEN</text>
    <rect x="482" y="450" width="184" height="11" rx="5.5" fill="#162130"/><rect x="482" y="450" width="156" height="11" rx="5.5" fill="url(#bm-progress)"/><text class="bm-micro" x="482" y="483">NEXT LEVEL</text><text class="bm-micro" x="666" y="483" text-anchor="end">85%</text>
  </g>
  <g class="bm-mono"><circle class="bm-mint" cx="24" cy="540" r="3.2"/><text class="bm-log" x="37" y="544">AUTO-SAVE ON</text><text class="bm-log" x="696" y="544" text-anchor="end">KEEP SHIPPING</text></g>
</svg>
