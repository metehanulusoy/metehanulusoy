<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="bug-hunt-title bug-hunt-desc">
  <title id="bug-hunt-title">Bug Hunt — a playful developer side quest</title>
  <desc id="bug-hunt-desc">An animated pixel game follows a software idea through code, bug discovery, debugging, testing and shipping, ending with an achievement and experience reward.</desc>
  <defs>
    <linearGradient id="bh-panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset=".58" stop-color="#090E18"/><stop offset="1" stop-color="#070A11"/></linearGradient>
    <linearGradient id="bh-edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32F5C4"/><stop offset=".47" stop-color="#4DA3FF"/><stop offset=".73" stop-color="#FF4ECD"/><stop offset="1" stop-color="#FFD166"/></linearGradient>
    <linearGradient id="bh-progress" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32F5C4"/><stop offset=".52" stop-color="#4DA3FF"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient>
    <radialGradient id="bh-glow"><stop stop-color="#32F5C4" stop-opacity=".38"/><stop offset="1" stop-color="#32F5C4" stop-opacity="0"/></radialGradient>
    <pattern id="bh-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#4DA3FF" stroke-opacity=".052"/></pattern>
    <pattern id="bh-scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#EDF6FF" stroke-opacity=".018"/></pattern>
    <clipPath id="bh-clip"><rect x="1" y="1" width="998" height="318" rx="17"/></clipPath>
    <clipPath id="bh-track-clip"><rect x="31" y="75" width="640" height="183" rx="11"/></clipPath>
    <filter id="bh-soft-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="bh-player">
      <rect x="-9" y="-24" width="18" height="16" rx="2" fill="#FFD166" stroke="#080B12" stroke-width="2"/>
      <rect x="-5" y="-19" width="3" height="3" fill="#080B12"/><rect x="3" y="-19" width="3" height="3" fill="#080B12"/>
      <path d="M-5-12h10" stroke="#080B12" stroke-width="2"/>
      <path d="M-12-6h24v19h-24z" fill="#4DA3FF" stroke="#080B12" stroke-width="2"/>
      <path d="M-7 0l5 4-5 4M7 0L2 4l5 4" fill="none" stroke="#EDF6FF" stroke-width="1.7"/>
      <path class="bh-legs" d="M-6 13v10h-6M6 13v10h6" fill="none" stroke="#32F5C4" stroke-width="4.5" stroke-linecap="square"/>
      <path d="M-12-2h-6v11M12-2h6v11" fill="none" stroke="#FF4ECD" stroke-width="4"/>
    </g>
    <g id="bh-bug" fill="#FF6B6B" stroke="#080B12" stroke-width="2">
      <rect x="-11" y="-9" width="22" height="18" rx="4"/>
      <rect x="-6" y="-4" width="4" height="4" fill="#080B12"/><rect x="2" y="-4" width="4" height="4" fill="#080B12"/>
      <path d="M-11-4h-7M11-4h7M-11 4h-7M11 4h7M-6-9l-5-6M6-9l5-6" fill="none" stroke="#FF6B6B" stroke-width="3.5"/>
    </g>
    <g id="bh-trophy">
      <path d="M-21-25h42v13c0 19-11 31-21 31s-21-12-21-31z" fill="#FFD166" stroke="#080B12" stroke-width="4"/>
      <path d="M-21-17h-13v9c0 11 7 17 16 17M21-17h13v9c0 11-7 17-16 17" fill="none" stroke="#FFD166" stroke-width="7"/>
      <path d="M0 19v13M-17 36h34" stroke="#FFD166" stroke-width="8"/>
      <path d="M0-17l4 8 9 1-7 6 2 9-8-4-8 4 2-9-7-6 9-1z" fill="#080B12"/>
    </g>
  </defs>
  <style>
    .bh-bg{fill:url(#bh-panel)}.bh-border{fill:none;stroke:url(#bh-edge);stroke-width:1.5}.bh-grid{fill:url(#bh-grid)}.bh-scanlines{fill:url(#bh-scan)}
    .bh-mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.bh-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}
    .bh-top{font-size:9.5px;font-weight:750;letter-spacing:1.45px;fill:#C5D0DA}.bh-micro{font-size:8px;font-weight:750;letter-spacing:1.25px;fill:#82909C}
    .bh-section{font-size:10px;font-weight:800;letter-spacing:1.2px;fill:#B8C4CE}.bh-value{font-size:13px;font-weight:850;fill:#EDF6FF}.bh-caption{font-size:8.5px;font-weight:750;letter-spacing:.65px;fill:#A9B6C2}
    .bh-track{fill:#080D16;stroke:#334155}.bh-award{fill:#0C121D;stroke:#334155}.bh-route{fill:none;stroke:#283649;stroke-width:5;stroke-linecap:round}.bh-route-live{fill:none;stroke:url(#bh-progress);stroke-width:5;stroke-linecap:round;stroke-dasharray:8 8}
    .bh-node{fill:#111A27;stroke:#4DA3FF;stroke-width:1.5}.bh-node-pink{fill:#171225;stroke:#FF4ECD;stroke-width:1.5}.bh-node-warn{fill:#231416;stroke:#FF6B6B;stroke-width:1.5}.bh-node-ship{fill:#101D1C;stroke:#32F5C4;stroke-width:1.5}
    .bh-node-id{font-size:7px;font-weight:850;letter-spacing:1px;fill:#738396}.bh-node-title{font-size:9.5px;font-weight:850;letter-spacing:.7px;fill:#EDF6FF}.bh-node-sub{font-size:7px;font-weight:700;fill:#8593A1}
    .bh-mint{fill:#32F5C4}.bh-blue{fill:#4DA3FF}.bh-pink{fill:#FF4ECD}.bh-yellow{fill:#FFD166}.bh-coral{fill:#FF6B6B}
    .bh-toast-title{font-size:8px;font-weight:850;letter-spacing:1.35px;fill:#32F5C4}.bh-award-title{font-size:24px;font-weight:900;letter-spacing:.5px;fill:#EDF6FF}.bh-xp{font-size:13px;font-weight:900;fill:#FFD166}.bh-log{font-size:8.5px;font-weight:750;letter-spacing:1.15px;fill:#A9B6C2}
    .bh-dash{animation:bh-dash 1.25s linear infinite}.bh-bug-hop{transform-box:fill-box;transform-origin:center;animation:bh-bug-hop .85s steps(2,end) infinite}.bh-alert{transform-box:fill-box;transform-origin:center;animation:bh-alert 1.35s ease-in-out infinite}.bh-toast{transform-box:fill-box;transform-origin:center;animation:bh-toast 4.5s ease-in-out infinite}.bh-spark-a{animation:bh-spark-a 1.8s ease-in-out infinite}.bh-spark-b{animation:bh-spark-b 1.8s .55s ease-in-out infinite}.bh-spark-c{animation:bh-spark-c 1.8s 1.05s ease-in-out infinite}.bh-legs{animation:bh-legs .3s steps(2,end) infinite}.bh-cursor{animation:bh-cursor .9s steps(1,end) infinite}.bh-static{display:none}
    @keyframes bh-dash{to{stroke-dashoffset:-32}}@keyframes bh-bug-hop{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-6px) rotate(4deg)}}
    @keyframes bh-alert{0%,100%{opacity:.28;transform:scale(.82)}50%{opacity:.9;transform:scale(1.15)}}@keyframes bh-toast{0%,12%,88%,100%{transform:translateY(2px)}20%,80%{transform:translateY(-2px)}}
    @keyframes bh-spark-a{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(-6px,-8px);opacity:1}}@keyframes bh-spark-b{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(7px,-5px);opacity:1}}@keyframes bh-spark-c{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(3px,8px);opacity:1}}
    @keyframes bh-legs{0%{stroke-dasharray:15 8}100%{stroke-dasharray:6 5}}@keyframes bh-cursor{0%,52%{opacity:1}53%,100%{opacity:.18}}
    @media(prefers-color-scheme:light){.bh-bg{fill:#F6F8FA}.bh-track,.bh-award{fill:#FFFFFF}.bh-grid{opacity:.48}.bh-scanlines{opacity:.14}.bh-top,.bh-section,.bh-log{fill:#475569}.bh-micro,.bh-caption,.bh-node-id,.bh-node-sub{fill:#64748B}.bh-value,.bh-node-title,.bh-award-title{fill:#172033}.bh-node{fill:#F4F9FF}.bh-node-pink{fill:#FFF5FC}.bh-node-warn{fill:#FFF6F4}.bh-node-ship{fill:#F1FFFA}.bh-route{stroke:#D7E0EA}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.bh-motion{display:none!important}.bh-static{display:inline}}
  </style>
  <rect class="bh-bg" x="1" y="1" width="998" height="318" rx="17"/>
  <g clip-path="url(#bh-clip)"><rect class="bh-grid" x="1" y="1" width="998" height="318"/><rect class="bh-scanlines" x="1" y="1" width="998" height="318"/></g>
  <rect class="bh-border" x="1" y="1" width="998" height="318" rx="17"/>

  <g class="bh-mono">
    <text class="bh-top" x="28" y="29">BUG_HUNT.EXE</text>
    <rect x="143" y="16" width="78" height="18" rx="9" fill="#32F5C4" fill-opacity=".1" stroke="#32F5C4" stroke-opacity=".42"/>
    <circle class="bh-mint bh-cursor" cx="156" cy="25" r="3"/><text class="bh-micro" x="165" y="28">RUNNING</text>
    <text class="bh-top" x="972" y="29" text-anchor="end">SIDE QUEST 01  /  DIFFICULTY: REAL LIFE</text>
  </g>
  <path d="M24 46H976" stroke="#334155"/>

  <g class="bh-mono">
    <rect class="bh-track" x="28" y="63" width="648" height="204" rx="11"/>
    <text class="bh-section" x="47" y="87">MISSION ROUTE</text><text class="bh-micro" x="657" y="87" text-anchor="end">FIX → VERIFY → DEPLOY</text>
    <path d="M46 98H658" stroke="#273548"/>

    <g clip-path="url(#bh-track-clip)">
      <circle cx="346" cy="178" r="65" fill="url(#bh-glow)" opacity=".26"/>
      <path class="bh-route" d="M95 172H609"/>
      <path class="bh-route-live bh-dash bh-motion" d="M95 172H609"/>
      <path class="bh-route-live bh-static" d="M95 172H609" stroke-dasharray="0"/>
      <g class="bh-motion motion" opacity=".65">
        <circle r="3" fill="#32F5C4"><animateMotion dur="3.8s" repeatCount="indefinite" path="M95 172H609"/></circle>
        <circle r="2.5" fill="#FF4ECD"><animateMotion begin="-1.4s" dur="3.8s" repeatCount="indefinite" path="M95 172H609"/></circle>
      </g>
    </g>

    <g transform="translate(48 119)"><rect class="bh-node" width="94" height="46" rx="6"/><text class="bh-node-id" x="10" y="15">STAGE 01</text><text class="bh-node-title" x="10" y="31">IDEA / CODE</text><circle class="bh-blue" cx="82" cy="13" r="3"/></g>
    <g transform="translate(174 119)"><rect class="bh-node-warn" width="94" height="46" rx="6"/><text class="bh-node-id" x="10" y="15">STAGE 02</text><text class="bh-node-title" x="10" y="31">BUG FOUND</text><path d="M79 9l7 12H72z" fill="#FF6B6B"/><path d="M79 13v4M79 19v1" stroke="#080B12" stroke-width="1.5"/></g>
    <g transform="translate(300 119)"><rect class="bh-node-pink" width="94" height="46" rx="6"/><text class="bh-node-id" x="10" y="15">STAGE 03</text><text class="bh-node-title" x="10" y="31">DEBUG</text><text class="bh-pink" x="82" y="18" text-anchor="middle" font-size="13">⌁</text></g>
    <g transform="translate(426 119)"><rect class="bh-node" width="94" height="46" rx="6"/><text class="bh-node-id" x="10" y="15">STAGE 04</text><text class="bh-node-title" x="10" y="31">TEST</text><path d="M75 15l4 4 8-9" fill="none" stroke="#32F5C4" stroke-width="2.2"/></g>
    <g transform="translate(552 119)"><rect class="bh-node-ship" width="94" height="46" rx="6"/><text class="bh-node-id" x="10" y="15">STAGE 05</text><text class="bh-node-title" x="10" y="31">SHIP</text><path d="M76 20l11-7-4 12-3-4-4 3z" fill="#32F5C4"/></g>

    <g transform="translate(95 207)"><circle r="13" fill="#111A27" stroke="#4DA3FF" stroke-width="2"/><text class="bh-caption" y="3" text-anchor="middle">&lt;/&gt;</text></g>
    <g transform="translate(221 207)"><g class="bh-bug-hop"><use href="#bh-bug"/></g></g>
    <g transform="translate(347 207)"><circle class="bh-alert" r="22" fill="#FF4ECD" opacity=".18"/><circle r="13" fill="#171225" stroke="#FF4ECD" stroke-width="2"/><text class="bh-caption" y="3" text-anchor="middle">{ }</text></g>
    <g transform="translate(473 207)"><circle r="13" fill="#101D1C" stroke="#32F5C4" stroke-width="2"/><path d="M-6 0l4 4 8-9" fill="none" stroke="#32F5C4" stroke-width="2"/></g>
    <g transform="translate(599 207)"><circle r="13" fill="#101D1C" stroke="#32F5C4" stroke-width="2"/><path d="M-5 4V-5l11 5z" fill="#32F5C4"/></g>
    <g class="bh-motion motion" clip-path="url(#bh-track-clip)"><g><use href="#bh-player"/><animateMotion dur="7.5s" repeatCount="indefinite" keyTimes="0;.18;.35;.55;.76;1" keyPoints="0;.18;.35;.55;.76;1" calcMode="linear" path="M95 205 C135 205 178 191 221 205 S305 220 347 205 S431 191 473 205 S557 220 609 205"/></g></g>
    <g class="bh-static" transform="translate(347 205)"><use href="#bh-player"/></g>
    <text class="bh-micro" x="48" y="248">LOOP: BUILD  →  BREAK  →  TRACE  →  FIX  →  SHIP</text><text class="bh-micro" x="657" y="248" text-anchor="end">5 / 5 CHECKPOINTS</text>
  </g>

  <g class="bh-mono bh-toast">
    <rect class="bh-award" x="694" y="63" width="278" height="204" rx="11"/>
    <path d="M713 98H953" stroke="#273548"/>
    <text class="bh-toast-title" x="716" y="87">ACHIEVEMENT UNLOCKED</text><circle class="bh-mint bh-cursor" cx="950" cy="84" r="3"/>
    <g transform="translate(755 151)"><circle r="47" fill="#FFD166" opacity=".08"/><circle class="bh-motion motion" r="37" fill="none" stroke="#FFD166" stroke-opacity=".23" stroke-width="1.5" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle><use href="#bh-trophy"/></g>
    <g transform="translate(713 123)"><g class="bh-spark-a"><rect class="bh-pink" width="4" height="4"/></g></g><g transform="translate(797 110)"><g class="bh-spark-b"><rect class="bh-mint" width="4" height="4"/></g></g><g transform="translate(805 183)"><g class="bh-spark-c"><rect class="bh-blue" width="4" height="4"/></g></g>
    <text class="bh-award-title bh-sans" x="823" y="142">SHIP IT!</text><text class="bh-xp" x="824" y="164">+120 XP</text>
    <text class="bh-caption" x="824" y="184">BUG FIXED  ·  TESTS GREEN</text>
    <rect x="716" y="218" width="234" height="9" rx="4.5" fill="#162130"/><rect x="716" y="218" width="199" height="9" rx="4.5" fill="url(#bh-progress)"/>
    <text class="bh-micro" x="716" y="247">NEXT LEVEL</text><text class="bh-micro" x="950" y="247" text-anchor="end">85%</text>
  </g>

  <g class="bh-mono"><circle class="bh-mint" cx="30" cy="294" r="3"/><text class="bh-log" x="42" y="297">MISSION LOG  //  THE BUG WAS DOCUMENTATION</text><text class="bh-log" x="970" y="297" text-anchor="end">AUTO-SAVE ON  ·  KEEP SHIPPING</text></g>
</svg>
