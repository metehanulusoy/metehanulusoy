<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Metehan Ulusoy — Builder skill tree</title>
  <desc id="desc">An animated game-style skill tree with an equal focus on software, web and design, AI and machine learning, and automation, all connected to the core quest of building and shipping useful things.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset=".58" stop-color="#090E18"/>
      <stop offset="1" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#32F5C4"/>
      <stop offset=".5" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132637"/>
      <stop offset=".52" stop-color="#111827"/>
      <stop offset="1" stop-color="#22142A"/>
    </linearGradient>
    <linearGradient id="coreEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#32F5C4"/>
      <stop offset=".48" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#4DA3FF" stroke-opacity=".05"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#EDF6FF" stroke-opacity=".018"/>
    </pattern>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="358" rx="18"/></clipPath>

    <g id="pixelCode" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M-8-9l-10 9L-8 9M8-9l10 9L8 9M4-14L-4 14"/>
    </g>
    <g id="pixelWindow" fill="none" stroke="currentColor" stroke-width="3">
      <rect x="-18" y="-14" width="36" height="28" rx="2"/><path d="M-18-6h36"/><path d="M-12-10h2M-6-10h2" stroke-width="4"/><path d="M-12 1h10M-12 7H8"/>
    </g>
    <g id="pixelNodes" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M-13-8L0-14 13-8 11 8 0 14-11 8zM-13-8L0 0 13-8M0 0v14"/><circle cx="-13" cy="-8" r="3" fill="currentColor"/><circle cx="13" cy="-8" r="3" fill="currentColor"/><circle cy="14" r="3" fill="currentColor"/>
    </g>
    <g id="pixelGear" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M-4-17h8l2 6 6-2 5 6-4 5 4 5-5 7-6-3-2 7h-8l-2-7-6 3-5-7 4-5-4-5 5-6 6 2z"/><circle r="6"/>
    </g>
    <g id="spark" fill="currentColor">
      <path d="M0-6l2.2 3.8L6 0 2.2 2.2 0 6-2.2 2.2-6 0l3.8-2.2z"/>
    </g>
  </defs>

  <style>
    .panel{fill:url(#panel)}.grid{fill:url(#grid)}.scanlines{fill:url(#scanlines)}.border{fill:none;stroke:url(#edge);stroke-width:1.5}
    .mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}
    .top{font-size:9.5px;font-weight:700;letter-spacing:1.5px;fill:#C5D0DA}.micro{font-size:8px;font-weight:700;letter-spacing:1.2px;fill:#82909C}
    .wire{fill:none;stroke:#2C4054;stroke-width:3;stroke-linecap:square}.wire-glow{fill:none;stroke:url(#edge);stroke-width:3;stroke-linecap:square;opacity:.88;stroke-dasharray:1;animation:draw 5s ease-in-out infinite}
    .node{fill:#0C1420;stroke:#334155;stroke-width:1.5}.node-edge{fill:none;stroke-width:2.5;stroke-linecap:square}.node-title{font-size:15px;font-weight:850;letter-spacing:.5px;fill:#EDF6FF}.node-copy{font-size:8.5px;font-weight:700;letter-spacing:.65px;fill:#82909C}
    .status-bg{fill:#111C29}.status-text{font-size:7px;font-weight:850;letter-spacing:1px}.software{color:#32F5C4;stroke:#32F5C4}.web{color:#FF4ECD;stroke:#FF4ECD}.ai{color:#4DA3FF;stroke:#4DA3FF}.auto{color:#FFD166;stroke:#FFD166}
    .core-shadow{fill:#4DA3FF;opacity:.16}.core{fill:url(#coreFill);stroke:url(#coreEdge);stroke-width:2}.core-kicker{font-size:8px;font-weight:800;letter-spacing:1.5px;fill:#32F5C4}.core-title{font-size:19px;font-weight:900;letter-spacing:.8px;fill:#EDF6FF}.core-copy{font-size:8.5px;font-weight:700;letter-spacing:1.2px;fill:#9AA8B6}
    .socket{fill:#080B12;stroke:#4DA3FF;stroke-width:2}.socket-on{fill:#32F5C4}.chip{fill:#101925;stroke:#334155}.chip-text{font-size:7px;font-weight:800;letter-spacing:.7px;fill:#A8B4C0}
    .pulse{filter:url(#glow)}.pulse-soft{fill:#32F5C4}.pulse-web{fill:#FF4ECD}.pulse-ai{fill:#4DA3FF}.pulse-auto{fill:#FFD166}
    .float{animation:float 2.5s ease-in-out infinite}.float2{animation:float 2.5s .35s ease-in-out infinite}.float3{animation:float 2.5s .7s ease-in-out infinite}.float4{animation:float 2.5s 1.05s ease-in-out infinite}
    .core-pulse{transform-box:fill-box;transform-origin:center;animation:corePulse 2.8s ease-out infinite}.blink{animation:blink 1.2s steps(1,end) infinite}.scan{animation:scan 8s ease-in-out infinite}
    @keyframes draw{0%,10%{stroke-dashoffset:1;opacity:.2}45%,75%{stroke-dashoffset:0;opacity:.9}100%{stroke-dashoffset:-1;opacity:.2}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes corePulse{0%{transform:scale(.72);opacity:.4}70%,100%{transform:scale(1.35);opacity:0}}
    @keyframes blink{0%,58%{opacity:1}59%,100%{opacity:.25}}@keyframes scan{0%,12%{transform:translateX(-230px);opacity:0}35%,65%{opacity:.14}88%,100%{transform:translateX(1080px);opacity:0}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.grid{opacity:.55}.scanlines{opacity:.12}.top{fill:#334155}.micro,.node-copy,.core-copy,.chip-text{fill:#64748B}.wire{stroke:#C7D2E0}.node{fill:#FFFFFF;stroke:#CBD5E1}.node-title,.core-title{fill:#172033}.status-bg,.chip{fill:#F1F5F9}.core{fill:#FFFFFF}.core-shadow{opacity:.1}.socket{fill:#FFFFFF}.border{opacity:.82}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none!important}}
  </style>

  <rect class="panel" x="1" y="1" width="998" height="358" rx="18"/>
  <g clip-path="url(#clip)">
    <rect class="grid" x="1" y="1" width="998" height="358"/>
    <rect class="scanlines" x="1" y="1" width="998" height="358"/>
    <rect class="scan motion" x="-230" y="1" width="190" height="358" fill="#32F5C4" opacity="0"/>
  </g>
  <rect class="border" x="1" y="1" width="998" height="358" rx="18"/>

  <g class="mono">
    <text class="top" x="32" y="31">SKILL_TREE.MAP</text>
    <rect x="157" y="18" width="88" height="19" rx="9.5" fill="#32F5C4" fill-opacity=".09" stroke="#32F5C4" stroke-opacity=".42"/>
    <circle class="socket-on blink" cx="170" cy="27.5" r="3"/>
    <text class="micro" x="179" y="30.5">4 ACTIVE</text>
    <text class="top" x="968" y="31" text-anchor="end">BUILD CLASS  /  GENERALIST</text>
  </g>
  <path d="M26 48H974" stroke="#334155"/>

  <g aria-hidden="true">
    <path class="wire" d="M395 166C340 166 336 111 286 111"/>
    <path class="wire" d="M395 214C337 214 337 268 286 268"/>
    <path class="wire" d="M605 166C660 166 664 111 714 111"/>
    <path class="wire" d="M605 214C663 214 663 268 714 268"/>
    <path class="wire-glow" pathLength="1" d="M395 166C340 166 336 111 286 111"/>
    <path class="wire-glow" pathLength="1" d="M395 214C337 214 337 268 286 268"/>
    <path class="wire-glow" pathLength="1" d="M605 166C660 166 664 111 714 111"/>
    <path class="wire-glow" pathLength="1" d="M605 214C663 214 663 268 714 268"/>

    <g class="motion pulse"><circle class="pulse-soft" r="4"><animateMotion dur="3.6s" repeatCount="indefinite" path="M395 166C340 166 336 111 286 111"/></circle></g>
    <g class="motion pulse"><circle class="pulse-web" r="4"><animateMotion dur="3.9s" begin=".7s" repeatCount="indefinite" path="M395 214C337 214 337 268 286 268"/></circle></g>
    <g class="motion pulse"><circle class="pulse-ai" r="4"><animateMotion dur="3.7s" begin=".35s" repeatCount="indefinite" path="M605 166C660 166 664 111 714 111"/></circle></g>
    <g class="motion pulse"><circle class="pulse-auto" r="4"><animateMotion dur="4.1s" begin="1s" repeatCount="indefinite" path="M605 214C663 214 663 268 714 268"/></circle></g>
  </g>

  <g class="mono" transform="translate(60 73)">
    <rect class="node" width="226" height="76" rx="9"/>
    <path class="node-edge software" d="M0 12V0h12M214 0h12v12M0 64v12h12M214 76h12V64"/>
    <g class="software" transform="translate(34 38)"><g class="float"><use href="#pixelCode"/></g></g>
    <text class="node-title" x="65" y="29">SOFTWARE</text>
    <text class="node-copy" x="65" y="47">APIs · SYSTEMS · TOOLS</text>
    <g transform="translate(158 56)"><rect class="status-bg" width="54" height="14" rx="7"/><circle class="socket-on" cx="9" cy="7" r="2.5"/><text class="status-text" x="17" y="9.7" fill="#32F5C4">ACTIVE</text></g>
  </g>

  <g class="mono" transform="translate(60 230)">
    <rect class="node" width="226" height="76" rx="9"/>
    <path class="node-edge web" d="M0 12V0h12M214 0h12v12M0 64v12h12M214 76h12V64"/>
    <g class="web" transform="translate(34 38)"><g class="float2"><use href="#pixelWindow"/></g></g>
    <text class="node-title" x="65" y="29">WEB + DESIGN</text>
    <text class="node-copy" x="65" y="47">UI · MOTION · EXPERIENCES</text>
    <g transform="translate(158 56)"><rect class="status-bg" width="54" height="14" rx="7"/><circle cx="9" cy="7" r="2.5" fill="#FF4ECD"/><text class="status-text" x="17" y="9.7" fill="#FF4ECD">ACTIVE</text></g>
  </g>

  <g class="mono" transform="translate(714 73)">
    <rect class="node" width="226" height="76" rx="9"/>
    <path class="node-edge ai" d="M0 12V0h12M214 0h12v12M0 64v12h12M214 76h12V64"/>
    <g class="ai" transform="translate(34 38)"><g class="float3"><use href="#pixelNodes"/></g></g>
    <text class="node-title" x="65" y="29">AI / ML</text>
    <text class="node-copy" x="65" y="47">MODELS · SEARCH · DATA</text>
    <g transform="translate(158 56)"><rect class="status-bg" width="54" height="14" rx="7"/><circle cx="9" cy="7" r="2.5" fill="#4DA3FF"/><text class="status-text" x="17" y="9.7" fill="#4DA3FF">ACTIVE</text></g>
  </g>

  <g class="mono" transform="translate(714 230)">
    <rect class="node" width="226" height="76" rx="9"/>
    <path class="node-edge auto" d="M0 12V0h12M214 0h12v12M0 64v12h12M214 76h12V64"/>
    <g class="auto" transform="translate(34 38)"><g class="float4"><use href="#pixelGear"/></g></g>
    <text class="node-title" x="65" y="29">AUTOMATION</text>
    <text class="node-copy" x="65" y="47">WORKFLOWS · BOTS · GLUE</text>
    <g transform="translate(158 56)"><rect class="status-bg" width="54" height="14" rx="7"/><circle cx="9" cy="7" r="2.5" fill="#FFD166"/><text class="status-text" x="17" y="9.7" fill="#FFD166">ACTIVE</text></g>
  </g>

  <g aria-hidden="true">
    <rect class="core-shadow core-pulse motion" x="386" y="137" width="228" height="108" rx="18"/>
    <circle class="pulse-soft" cx="395" cy="166" r="4"/><circle class="pulse-web" cx="395" cy="214" r="4"/>
    <circle class="pulse-ai" cx="605" cy="166" r="4"/><circle class="pulse-auto" cx="605" cy="214" r="4"/>
  </g>
  <g class="mono">
    <rect class="core" x="395" y="139" width="210" height="102" rx="14"/>
    <text class="core-kicker" x="500" y="160" text-anchor="middle">CORE QUEST</text>
    <text class="core-title" x="500" y="186" text-anchor="middle">BUILD &amp; SHIP</text>
    <text class="core-title" x="500" y="208" text-anchor="middle">USEFUL THINGS</text>
    <text class="core-copy" x="500" y="228" text-anchor="middle">CURIOSITY + CRAFT</text>
  </g>

  <g class="mono">
    <g transform="translate(318 318)"><rect class="chip" width="74" height="19" rx="4"/><text class="chip-text" x="37" y="12.7" text-anchor="middle">BUILD</text></g>
    <text class="micro" x="401" y="331">→</text>
    <g transform="translate(418 318)"><rect class="chip" width="74" height="19" rx="4"/><text class="chip-text" x="37" y="12.7" text-anchor="middle">BREAK</text></g>
    <text class="micro" x="501" y="331">→</text>
    <g transform="translate(518 318)"><rect class="chip" width="74" height="19" rx="4"/><text class="chip-text" x="37" y="12.7" text-anchor="middle">LEARN</text></g>
    <text class="micro" x="601" y="331">→</text>
    <g transform="translate(618 318)"><rect class="chip" width="74" height="19" rx="4"/><text class="chip-text" x="37" y="12.7" text-anchor="middle">SHIP</text></g>
    <g class="motion software" transform="translate(297 327)"><use href="#spark"/></g>
    <g class="motion web" transform="translate(713 327)"><use href="#spark"/></g>
  </g>
</svg>
