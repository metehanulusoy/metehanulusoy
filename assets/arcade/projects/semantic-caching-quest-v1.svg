<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Quest 03: SEMANTIC CACHING. Streaming-safe semantic reuse with adaptive TTL and observability">
<title>Quest 03 — SEMANTIC CACHING</title><desc>Streaming-safe semantic reuse with adaptive TTL and observability</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#070A11"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32F5C4"/><stop offset="1" stop-color="#FFD166"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#32F5C4" stroke-opacity=".045"/></pattern></defs>
<style>
text{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.panel{fill:url(#panel)}.grid{fill:url(#grid)}.border{fill:none;stroke:url(#edge);stroke-width:1.25}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}.micro{font-size:9px;font-weight:750;letter-spacing:1.25px;fill:#82909C}.quest{font-size:10px;font-weight:850;letter-spacing:1.4px;fill:#32F5C4}
.title{font-size:25px;font-weight:850;letter-spacing:.3px;fill:#EDF6FF}.body{font-size:13px;font-weight:450;fill:#A8B4C0}.role{font-size:9px;font-weight:750;letter-spacing:1px;fill:#C8D3DD}
.pill{fill:#32F5C4;fill-opacity:.08;stroke:#32F5C4;stroke-opacity:.35}.pill-t{font-size:9px;font-weight:700;fill:#CBD6DF}.status{fill:#32F5C4;fill-opacity:.12;stroke:#32F5C4;stroke-opacity:.65}.status-t{font-size:9px;font-weight:850;letter-spacing:1px;fill:#32F5C4}
.screen{fill:#080D16;stroke:#334155}.soft{fill:#32F5C4;fill-opacity:.16;stroke:#32F5C4}.soft2{fill:#FFD166;fill-opacity:.16;stroke:#FFD166}.dim,.accent-stroke{fill:none;stroke:#3A4A5D;stroke-width:2}.accent-stroke{stroke:#32F5C4}.route{fill:none;stroke:#32F5C4;stroke-width:2;stroke-dasharray:6 6;animation:route 2.4s linear infinite}
.scene-t{font-size:8px;font-weight:750;letter-spacing:1px;fill:#95A3B0}.cursor{animation:cursor 4.8s ease-in-out infinite}.a1{animation:pop 4.8s .15s ease-in-out infinite}.a2{animation:pop 4.8s .4s ease-in-out infinite}.a3{animation:pop 4.8s .65s ease-in-out infinite}.a4{animation:pop 4.8s .9s ease-in-out infinite}
.avatar circle,.avatar path,.node circle,.core circle{fill:#101B28;stroke:#32F5C4;stroke-width:2}.avatar path{fill:none}.av1{animation:bob 3s ease-in-out infinite}.av2{animation:bob 3s .4s ease-in-out infinite}.av3{animation:bob 3s .8s ease-in-out infinite}.bubble rect,.bubble path{fill:#111927;stroke:#FFD166}.bubble text,.query text,.core text,.node text,.flow text,.codeout text,.box text,.alert text{font-size:9px;font-weight:850;fill:#EDF6FF}.b1{animation:chat 4s ease-in-out infinite}.b2{animation:chat 4s 1.5s ease-in-out infinite}
.packet rect,.query rect,.flow rect,.codeout rect,.box rect,.alert path{fill:#111927;stroke:#32F5C4;stroke-width:2}.packet{transform:translate(-113px,-39px)}.packet text{font-size:8px;font-weight:850;fill:#EDF6FF}.p1{animation:packet 4.8s linear infinite}.p2{animation:packet 4.8s 1.2s linear infinite}.p3{animation:packet 4.8s 2.4s linear infinite}.hit{animation:hit 1.4s ease-in-out infinite}
.belt{stroke:#465466;stroke-width:8}.rollers circle{fill:#101824;stroke:#32F5C4}.box{transform:translate(-145px,4px);animation:box 5s linear infinite}.bx2{animation-delay:-2.5s}.alert{animation:alert 2s ease-in-out infinite}.scanline{stroke:#FFD166;stroke-width:3;animation:scanline 3s ease-in-out infinite}
.query{animation:query 4s ease-in-out infinite}.core{animation:core 2.8s ease-in-out infinite}.node circle{stroke:#FFD166}.n1{animation:pick 4.2s ease-in-out infinite}.n2{animation:pick 4.2s 1.1s ease-in-out infinite}.n3{animation:pick 4.2s 2.2s ease-in-out infinite}
.flow rect,.codeout rect{stroke:#FFD166}.gear circle,.gear path{fill:#111927;stroke:#32F5C4;stroke-width:2}.gear{animation:spin 7s linear infinite}.f1{animation:flow 4s ease-in-out infinite}.f2{animation:flow 4s .9s ease-in-out infinite}
.progress{fill:#14202B}.progress-in{fill:#32F5C4;animation:progress 6s ease-in-out infinite}
@keyframes route{to{stroke-dashoffset:-24}}@keyframes cursor{0%,15%{transform:translate(-105px,36px)}38%{transform:translate(-20px,-5px)}62%{transform:translate(54px,23px)}85%,100%{transform:translate(102px,-31px)}}@keyframes pop{0%,12%{opacity:.18;transform:translateY(5px)}24%,100%{opacity:1;transform:none}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes chat{0%,20%,100%{opacity:0;transform:translateY(7px)}30%,72%{opacity:1;transform:none}}@keyframes packet{0%{transform:translate(-113px,-39px);opacity:0}12%{opacity:1}72%{transform:translate(44px,30px);opacity:1}85%,100%{transform:translate(74px,30px);opacity:0}}@keyframes hit{0%,100%{opacity:.35}50%{opacity:1}}@keyframes box{from{transform:translate(-145px,4px)}to{transform:translate(145px,4px)}}@keyframes alert{0%,35%,100%{opacity:.3;transform:translateY(4px)}45%,72%{opacity:1;transform:none}}@keyframes scanline{0%,100%{transform:translateX(-80px);opacity:.1}50%{transform:translateX(72px);opacity:1}}@keyframes query{0%,15%{transform:translateX(-15px);opacity:.4}35%,100%{transform:none;opacity:1}}@keyframes core{0%,100%{opacity:.55}50%{opacity:1}}@keyframes pick{0%,20%,100%{opacity:.35}35%,60%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{0%,20%{opacity:.3}35%,70%{opacity:1}100%{opacity:.3}}@keyframes progress{0%{width:20px}55%,100%{width:96%}}
@media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.title{fill:#172033}.body,.micro,.scene-t{fill:#596879}.role,.pill-t{fill:#334155}.screen{fill:#FFFFFF}.avatar circle,.core circle,.node circle,.gear circle,.gear path,.packet rect,.query rect,.flow rect,.codeout rect,.box rect,.alert path,.bubble rect,.bubble path{fill:#FFFFFF}.bubble text,.query text,.core text,.node text,.flow text,.codeout text,.box text,.alert text,.packet text{fill:#172033}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
