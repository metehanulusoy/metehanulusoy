<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Quest 02: ANIMEVERSE. Track, discover and discuss anime through a social-first web experience">
<title>Quest 02 — ANIMEVERSE mobile</title><desc>Track, discover and discuss anime through a social-first web experience</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#070A11"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4DA3FF"/><stop offset="1" stop-color="#FF4ECD"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#4DA3FF" stroke-opacity=".045"/></pattern></defs>
<style>
text{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.panel{fill:url(#panel)}.grid{fill:url(#grid)}.border{fill:none;stroke:url(#edge);stroke-width:1.25}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}.micro{font-size:16px;font-weight:750;letter-spacing:1px;fill:#82909C}.quest{font-size:18px;font-weight:850;letter-spacing:1px;fill:#4DA3FF}
.title{font-size:36px;font-weight:850;letter-spacing:.3px;fill:#EDF6FF}.body{font-size:20px;font-weight:450;fill:#A8B4C0}.role{font-size:17px;font-weight:750;letter-spacing:0.7px;fill:#C8D3DD}
.pill{fill:#4DA3FF;fill-opacity:.08;stroke:#4DA3FF;stroke-opacity:.35}.pill-t{font-size:15px;font-weight:700;fill:#CBD6DF}.status{fill:#4DA3FF;fill-opacity:.12;stroke:#4DA3FF;stroke-opacity:.65}.status-t{font-size:15px;font-weight:850;letter-spacing:0.7px;fill:#4DA3FF}
.screen{fill:#080D16;stroke:#334155}.soft{fill:#4DA3FF;fill-opacity:.16;stroke:#4DA3FF}.soft2{fill:#FF4ECD;fill-opacity:.16;stroke:#FF4ECD}.dim,.accent-stroke{fill:none;stroke:#3A4A5D;stroke-width:2}.accent-stroke{stroke:#4DA3FF}.route{fill:none;stroke:#4DA3FF;stroke-width:2;stroke-dasharray:6 6;animation:route 2.4s linear infinite}
.scene-t{font-size:11px;font-weight:750;letter-spacing:0.7px;fill:#95A3B0}.cursor{animation:cursor 4.8s ease-in-out infinite}.a1{animation:pop 4.8s .15s ease-in-out infinite}.a2{animation:pop 4.8s .4s ease-in-out infinite}.a3{animation:pop 4.8s .65s ease-in-out infinite}.a4{animation:pop 4.8s .9s ease-in-out infinite}
.avatar circle,.avatar path,.node circle,.core circle{fill:#101B28;stroke:#4DA3FF;stroke-width:2}.avatar path{fill:none}.av1{animation:bob 3s ease-in-out infinite}.av2{animation:bob 3s .4s ease-in-out infinite}.av3{animation:bob 3s .8s ease-in-out infinite}.bubble rect,.bubble path{fill:#111927;stroke:#FF4ECD}.bubble text,.query text,.core text,.node text,.flow text,.codeout text,.box text,.alert text{font-size:11px;font-weight:850;fill:#EDF6FF}.b1{animation:chat 4s ease-in-out infinite}.b2{animation:chat 4s 1.5s ease-in-out infinite}
.packet rect,.query rect,.flow rect,.codeout rect,.box rect,.alert path{fill:#111927;stroke:#4DA3FF;stroke-width:2}.packet{transform:translate(-113px,-39px)}.packet text{font-size:10px;font-weight:850;fill:#EDF6FF}.p1{animation:packet 4.8s linear infinite}.p2{animation:packet 4.8s 1.2s linear infinite}.p3{animation:packet 4.8s 2.4s linear infinite}.hit{animation:hit 1.4s ease-in-out infinite}
.belt{stroke:#465466;stroke-width:8}.rollers circle{fill:#101824;stroke:#4DA3FF}.box{transform:translate(-145px,4px);animation:box 5s linear infinite}.bx2{animation-delay:-2.5s}.alert{animation:alert 2s ease-in-out infinite}.scanline{stroke:#FF4ECD;stroke-width:3;animation:scanline 3s ease-in-out infinite}
.query{animation:query 4s ease-in-out infinite}.core{animation:core 2.8s ease-in-out infinite}.node circle{stroke:#FF4ECD}.n1{animation:pick 4.2s ease-in-out infinite}.n2{animation:pick 4.2s 1.1s ease-in-out infinite}.n3{animation:pick 4.2s 2.2s ease-in-out infinite}
.flow rect,.codeout rect{stroke:#FF4ECD}.gear circle,.gear path{fill:#111927;stroke:#4DA3FF;stroke-width:2}.gear{animation:spin 7s linear infinite}.f1{animation:flow 4s ease-in-out infinite}.f2{animation:flow 4s .9s ease-in-out infinite}
.progress{fill:#14202B}.progress-in{fill:#4DA3FF;animation:progress 6s ease-in-out infinite}
@keyframes route{to{stroke-dashoffset:-24}}@keyframes cursor{0%,15%{transform:translate(-105px,36px)}38%{transform:translate(-20px,-5px)}62%{transform:translate(54px,23px)}85%,100%{transform:translate(102px,-31px)}}@keyframes pop{0%,12%{opacity:.18;transform:translateY(5px)}24%,100%{opacity:1;transform:none}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes chat{0%,20%,100%{opacity:0;transform:translateY(7px)}30%,72%{opacity:1;transform:none}}@keyframes packet{0%{transform:translate(-113px,-39px);opacity:0}12%{opacity:1}72%{transform:translate(44px,30px);opacity:1}85%,100%{transform:translate(74px,30px);opacity:0}}@keyframes hit{0%,100%{opacity:.35}50%{opacity:1}}@keyframes box{from{transform:translate(-145px,4px)}to{transform:translate(145px,4px)}}@keyframes alert{0%,35%,100%{opacity:.3;transform:translateY(4px)}45%,72%{opacity:1;transform:none}}@keyframes scanline{0%,100%{transform:translateX(-80px);opacity:.1}50%{transform:translateX(72px);opacity:1}}@keyframes query{0%,15%{transform:translateX(-15px);opacity:.4}35%,100%{transform:none;opacity:1}}@keyframes core{0%,100%{opacity:.55}50%{opacity:1}}@keyframes pick{0%,20%,100%{opacity:.35}35%,60%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{0%,20%{opacity:.3}35%,70%{opacity:1}100%{opacity:.3}}@keyframes progress{0%{width:20px}55%,100%{width:96%}}
@media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.title{fill:#172033}.body,.micro,.scene-t{fill:#596879}.role,.pill-t{fill:#334155}.screen{fill:#FFFFFF}.avatar circle,.core circle,.node circle,.gear circle,.gear path,.packet rect,.query rect,.flow rect,.codeout rect,.box rect,.alert path,.bubble rect,.bubble path{fill:#FFFFFF}.bubble text,.query text,.core text,.node text,.flow text,.codeout text,.box text,.alert text,.packet text{fill:#172033}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="panel" x="1" y="1" width="718" height="558" rx="20"/><rect class="grid" x="1" y="1" width="718" height="558" rx="20"/><rect class="border" x="1" y="1" width="718" height="558" rx="20"/>
<text class="quest" x="32" y="44">QUEST 02 / SOCIAL ANIME PLATFORM</text><g transform="translate(532 22)"><rect class="status" width="156" height="35" rx="17.5"/><text class="status-t" x="78" y="23" text-anchor="middle">● SOCIAL / LIVE</text></g>
<text class="title sans" x="32" y="99">ANIMEVERSE</text><text class="body sans" x="32" y="137">Track, discover and discuss anime</text><text class="body sans" x="32" y="165">through a social-first web experience</text><text class="micro" x="32" y="207">PLAYER ROLE</text><text class="role" x="185" y="207">PRODUCT + FULL STACK</text><g transform="translate(32.0 226)"><rect class="pill" width="73.0" height="30" rx="15"/><text class="pill-t" x="36.5" y="20" text-anchor="middle">Next.js</text></g><g transform="translate(114.0 226)"><rect class="pill" width="80.0" height="30" rx="15"/><text class="pill-t" x="40.0" y="20" text-anchor="middle">Supabase</text></g><g transform="translate(203.0 226)"><rect class="pill" width="94.0" height="30" rx="15"/><text class="pill-t" x="47.0" y="20" text-anchor="middle">TypeScript</text></g>
<path d="M32 279H688" stroke="#334155"/><g transform="translate(360 390) scale(1.55)">
<g class="scene">
  <path class="route" d="M-105 27Q-55-70 0-18T105 27"/>
  <g transform="translate(-105 27)"><g class="avatar av1"><circle r="25"/><circle cy="-7" r="7"/><path d="M-13 12q13-18 26 0"/></g></g>
  <g transform="translate(0 -18)"><g class="avatar av2"><circle r="29"/><circle cy="-8" r="8"/><path d="M-15 14q15-21 30 0"/></g></g>
  <g transform="translate(105 27)"><g class="avatar av3"><circle r="25"/><circle cy="-7" r="7"/><path d="M-13 12q13-18 26 0"/></g></g>
  <g class="bubble b1"><rect x="-84" y="-62" width="52" height="29" rx="8"/><path d="M-72-33l-5 9 14-9"/><text x="-58" y="-43" text-anchor="middle">+1</text></g>
  <g class="bubble b2"><rect x="52" y="-57" width="60" height="29" rx="8"/><path d="M66-28l-5 9 14-9"/><text x="82" y="-38" text-anchor="middle">♥</text></g>
  <text class="scene-t" x="0" y="72" text-anchor="middle">DISCOVER · TRACK · DISCUSS</text>
</g></g>
<rect class="progress" x="32" y="532" width="656" height="8" rx="4"/><rect class="progress-in" x="32" y="532" width="630" height="8" rx="4"/>
</svg>