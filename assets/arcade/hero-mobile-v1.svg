<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
  <title id="title">Metehan Ulusoy — Dev Arcade mobile profile</title>
  <desc id="desc">A playful mobile developer arcade card where a pixel builder crosses software, web and design, AI and machine learning, and automation quests.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset=".56" stop-color="#090E18"/>
      <stop offset="1" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#32F5C4"/>
      <stop offset=".48" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#EDF6FF"/>
      <stop offset=".68" stop-color="#EDF6FF"/>
      <stop offset="1" stop-color="#32F5C4"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#32F5C4"/>
      <stop offset=".55" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF4ECD" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#4DA3FF" stroke-opacity=".065"/>
    </pattern>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 5.5H6" stroke="#EDF6FF" stroke-opacity=".02"/>
    </pattern>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="outerClip"><rect x="1" y="1" width="718" height="778" rx="28"/></clipPath>
    <clipPath id="sceneClip"><rect x="25" y="424" width="670" height="286" rx="18"/></clipPath>
    <g id="playerSprite">
      <rect x="-17" y="-41" width="34" height="29" rx="4" fill="#FFD166" stroke="#080B12" stroke-width="4"/>
      <rect x="-10" y="-33" width="5" height="5" fill="#080B12"/>
      <rect x="5" y="-33" width="5" height="5" fill="#080B12"/>
      <path d="M-9-21h18" stroke="#080B12" stroke-width="4"/>
      <path d="M-21-9h42v33h-42z" fill="#4DA3FF" stroke="#080B12" stroke-width="4"/>
      <path d="M-13 2l9 8-9 8M13 2L4 10l9 8" fill="none" stroke="#EDF6FF" stroke-width="3"/>
      <path class="leg-a" d="M-12 24v17h-11M12 24v17h11" fill="none" stroke="#32F5C4" stroke-width="8" stroke-linecap="square"/>
      <path d="M-21-3h-10v18M21-3h10v18" fill="none" stroke="#FF4ECD" stroke-width="7"/>
    </g>
    <g id="bugSprite" fill="#FF6B6B" stroke="#080B12" stroke-width="3">
      <rect x="-14" y="-13" width="28" height="26" rx="5"/>
      <rect x="-8" y="-7" width="5" height="5" fill="#080B12" stroke="none"/>
      <rect x="3" y="-7" width="5" height="5" fill="#080B12" stroke="none"/>
      <path d="M-14-6h-10M14-6h10M-14 6h-10M14 6h10M-7-13l-7-9M7-13l7-9" fill="none" stroke="#FF6B6B" stroke-width="5"/>
    </g>
  </defs>
  <style>
    .panel{fill:url(#panel)}.border{fill:none;stroke:url(#edge);stroke-width:2}.grid{fill:url(#grid)}.scanlines{fill:url(#scanlines)}
    .mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Roboto,sans-serif}
    .top{font-size:18px;font-weight:800;letter-spacing:2px;fill:#C5D0DA}.micro{font-size:17px;font-weight:750;letter-spacing:1.25px;fill:#82909C}.eyebrow{font-size:18px;font-weight:800;letter-spacing:2.4px;fill:#82909C}
    .name{font-size:50px;font-weight:900;letter-spacing:1px;fill:url(#titleFill)}.shadow{font-size:50px;font-weight:900;letter-spacing:1px;fill:#FF4ECD;opacity:.22}
    .tag{font-size:17px;font-weight:750;letter-spacing:1px;fill:#B8C4CE}.chip{fill:#101B28;stroke:#32F5C4;stroke-opacity:.5;stroke-width:1.5}.chip2{fill:#171226;stroke:#FF4ECD;stroke-opacity:.5;stroke-width:1.5}.chiptext{font-size:17px;font-weight:800;letter-spacing:1.2px;fill:#D4DEE7}
    .stat{fill:#0C1420;stroke:#334155;stroke-width:1.5}.stat-l{font-size:16px;font-weight:800;letter-spacing:1.2px;fill:#718092}.stat-v{font-size:19px;font-weight:850;fill:#EDF6FF}
    .screen{fill:#080D16;stroke:#334155;stroke-width:1.5}.screen-grid{fill:url(#grid);opacity:.9}.platform{fill:#111A27;stroke:#4DA3FF;stroke-width:3}.platform2{fill:#151224;stroke:#FF4ECD;stroke-width:3}
    .platform-text{font-size:17px;font-weight:850;letter-spacing:.8px;fill:#D2DCE5}.coin{fill:#FFD166;stroke:#080B12;stroke-width:3}.coin-text{font-size:13px;font-weight:950;fill:#080B12}.code{font-size:16px;font-weight:700;fill:#58687B}
    .portal{fill:url(#portal);stroke:#FF4ECD;stroke-width:3;stroke-dasharray:7 7}.portal-text{font-size:16px;font-weight:900;letter-spacing:.8px;fill:#FF9AE6}.status{font-size:17px;font-weight:800;letter-spacing:1.2px;fill:#B8C4CE}
    .mint{fill:#32F5C4}.yellow{fill:#FFD166}.pink{fill:#FF4ECD}.screen-rule{stroke:#273548}.xp-track{fill:#111A27}.xp-fill{fill:url(#xp)}
    .scan{animation:scan 7s ease-in-out infinite}.blink{animation:blink 1.1s steps(1,end) infinite}.coin1{animation:coin 1.8s ease-in-out infinite}.coin2{animation:coin 1.8s .4s ease-in-out infinite}.coin3{animation:coin 1.8s .8s ease-in-out infinite}
    .bug{transform-box:fill-box;transform-origin:center;animation:bug 1.1s steps(2,end) infinite}.portal-ring{transform-box:fill-box;transform-origin:center;animation:ring 5s linear infinite}.code-a{animation:floatA 8s linear infinite}.code-b{animation:floatB 9s -3s linear infinite}.leg-a{animation:legs .32s steps(2,end) infinite}.spark{animation:spark 1.6s steps(2,end) infinite}.runner{transform:translate(90px,584px);animation:runner 9s linear infinite}.static-motion{display:none}
    @keyframes scan{0%,12%{transform:translateY(-220px);opacity:0}35%,65%{opacity:.16}88%,100%{transform:translateY(780px);opacity:0}}
    @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.25}}@keyframes coin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes bug{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-7px) rotate(3deg)}}@keyframes ring{to{stroke-dashoffset:-84}}
    @keyframes floatA{from{transform:translateX(0)}to{transform:translateX(-250px)}}@keyframes floatB{from{transform:translateX(0)}to{transform:translateX(-300px)}}@keyframes legs{0%{stroke-dasharray:24 12}100%{stroke-dasharray:10 8}}@keyframes spark{0%,45%{opacity:1}46%,100%{opacity:.18}}@keyframes runner{0%{transform:translate(90px,584px)}22%{transform:translate(230px,562px)}43%{transform:translate(360px,600px)}63%{transform:translate(485px,598px)}82%,100%{transform:translate(625px,560px)}}
    @media(prefers-color-scheme:light){.panel{fill:#F6F8FA}.screen{fill:#FFFFFF}.screen-grid{opacity:.45}.name{fill:#172033}.shadow{fill:#FF4ECD;opacity:.14}.tag,.top,.status{fill:#475569}.eyebrow,.micro,.stat-l,.code{fill:#64748B}.chip,.stat{fill:#FFFFFF}.chip2{fill:#FFF7FD}.chiptext,.stat-v,.platform-text{fill:#263241}.platform{fill:#F4F9FF}.platform2{fill:#FFF5FC}.scanlines{opacity:.12}.xp-track{fill:#E7EDF4}.screen-rule{stroke:#CBD5E1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none!important}.static-motion{display:inline}}
  </style>

  <rect class="panel" x="1" y="1" width="718" height="778" rx="28"/>
  <g clip-path="url(#outerClip)">
    <rect class="grid" x="1" y="1" width="718" height="778"/>
    <rect class="scanlines" x="1" y="1" width="718" height="778"/>
    <rect class="scan motion" x="1" y="-230" width="718" height="180" fill="#32F5C4" opacity="0"/>
  </g>
  <rect class="border" x="1" y="1" width="718" height="778" rx="28"/>

  <g class="mono">
    <path d="M26 62H694" stroke="#334155"/>
    <path d="M31 24h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8z" fill="#4DA3FF"/>
    <text class="top" x="59" y="43">DEV_ARCADE.EXE</text>
    <rect x="520" y="20" width="162" height="27" rx="13.5" fill="#32F5C4" fill-opacity=".1" stroke="#32F5C4" stroke-opacity=".5"/>
    <circle class="mint blink" cx="541" cy="33.5" r="5"/>
    <text class="micro" x="556" y="39">PLAYER 01</text>
  </g>

  <g class="sans" text-anchor="middle">
    <text class="eyebrow mono" x="360" y="94">SELECT PLAYER  /  BUILDER MODE</text>
    <text class="shadow" x="364" y="151">METEHAN ULUSOY</text>
    <text class="name" x="360" y="147">METEHAN ULUSOY</text>
    <text class="tag mono" x="360" y="180">BUILDING THINGS. BREAKING THINGS.</text>
    <text class="tag mono" x="360" y="205">LEARNING IN PUBLIC.</text>
  </g>

  <g class="mono">
    <g transform="translate(36 225)"><rect class="chip" width="318" height="42" rx="8"/><text class="chiptext" x="159" y="27" text-anchor="middle">SOFTWARE</text></g>
    <g transform="translate(366 225)"><rect class="chip2" width="318" height="42" rx="8"/><text class="chiptext" x="159" y="27" text-anchor="middle">WEB + DESIGN</text></g>
    <g transform="translate(36 277)"><rect class="chip2" width="318" height="42" rx="8"/><text class="chiptext" x="159" y="27" text-anchor="middle">AI / ML</text></g>
    <g transform="translate(366 277)"><rect class="chip" width="318" height="42" rx="8"/><text class="chiptext" x="159" y="27" text-anchor="middle">AUTOMATION</text></g>

    <g transform="translate(36 338)"><rect class="stat" width="207" height="62" rx="10"/><text class="stat-l" x="16" y="23">LEVEL</text><text class="stat-v" x="16" y="47">03 / CENG</text></g>
    <g transform="translate(256 338)"><rect class="stat" width="207" height="62" rx="10"/><text class="stat-l" x="16" y="23">CLASS</text><text class="stat-v" x="16" y="47">GENERALIST</text></g>
    <g transform="translate(476 338)"><rect class="stat" width="208" height="62" rx="10"/><text class="stat-l" x="16" y="23">MODE</text><text class="stat-v" x="16" y="47">BUILD</text></g>
  </g>

  <g class="mono">
    <rect class="screen" x="24" y="417" width="672" height="310" rx="19"/>
    <rect class="screen-grid" x="25" y="418" width="670" height="308" rx="18"/>
    <path class="screen-rule" d="M42 465H678"/>
    <text class="micro" x="44" y="448">QUEST 01  /  SHIP SOMETHING</text>
    <text class="micro" x="676" y="448" text-anchor="end">SCORE 024</text>

    <g clip-path="url(#sceneClip)">
      <g class="code-a"><text class="code" x="430" y="492">const curiosity = true;</text><text class="code" x="535" y="520">git commit -m "learn"</text></g>
      <g class="code-b"><text class="code" x="310" y="525">if (bug) debug();</text><text class="code" x="465" y="548">while (idea) build();</text></g>
      <circle class="mint spark" cx="76" cy="493" r="4"/><path class="spark" d="M82 488h12M88 482v12" stroke="#32F5C4" stroke-width="3"/>
      <circle class="pink spark" cx="642" cy="505" r="4"/><path class="spark" d="M648 500h12M654 494v12" stroke="#FF4ECD" stroke-width="3"/>
    </g>

    <path class="platform" d="M52 625h128v17H52zM211 596h137v17H211zM380 637h126v17H380z"/>
    <path class="platform2" d="M536 603h128v17H536z"/>
    <text class="platform-text" x="116" y="639" text-anchor="middle">IDEA</text>
    <text class="platform-text" x="279.5" y="610" text-anchor="middle">CODE</text>
    <text class="platform-text" x="443" y="651" text-anchor="middle">TEST</text>
    <text class="platform-text" x="600" y="617" text-anchor="middle">SHIP</text>

    <g transform="translate(177 565)"><g class="coin1"><circle class="coin" r="18"/><text class="coin-text" y="4" text-anchor="middle">&lt;/&gt;</text></g></g>
    <g transform="translate(354 546)"><g class="coin2"><circle class="coin" r="18"/><text class="coin-text" y="4" text-anchor="middle">{ }</text></g></g>
    <g transform="translate(510 578)"><g class="coin3"><circle class="coin" r="18"/><text class="coin-text" y="4" text-anchor="middle">01</text></g></g>
    <g transform="translate(515 619)"><g class="bug"><use href="#bugSprite"/></g></g>
    <g class="portal-ring"><rect class="portal" x="611" y="520" width="49" height="81" rx="8"/></g>
    <text class="portal-text" x="635.5" y="566" text-anchor="middle">LIVE</text>

    <g class="motion" clip-path="url(#sceneClip)"><g class="runner"><use href="#playerSprite"/></g></g>
    <g class="static-motion" transform="translate(279 556)"><use href="#playerSprite"/></g>

    <rect class="xp-track" x="44" y="681" width="632" height="14" rx="7"/>
    <rect class="xp-fill motion" x="44" y="681" width="432" height="14" rx="7" opacity=".78"/>
    <text class="micro" x="44" y="716">XP  /  CURIOSITY</text>
    <text class="micro" x="676" y="716" text-anchor="end">BUILD → BREAK → LEARN → SHIP</text>
  </g>

  <g class="mono">
    <circle class="mint blink" cx="36" cy="753" r="5"/>
    <text class="status" x="52" y="759">READY FOR THE NEXT QUEST</text>
    <text class="status" x="684" y="759" text-anchor="end">UTC+3  /  ONLINE</text>
  </g>
</svg>
